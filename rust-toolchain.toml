# AriaHost 工具链 pin —— 全仓唯一事实源（S2 已定：Rust 1.95）
#
# 规则（违反即失效）：
# - 不要在 workflow 里给 rust toolchain action 传 toolchain / targets / components 输入：
#   该 action 在无输入时按本文件装工具链，传了就覆盖本文件的 pin。
# - 在本仓库目录内跑任何 cargo / rustc，rustup 自动切到 1.95（首次会下载，需联网）。
# - 升级只改下面 channel 一处，两个 workflow 自动跟随；不要在多处重复写版本号。
# - 本文件的内容未经 CI 实跑验证（本仓库 CI 从未在 GitHub 上运行过）。
[toolchain]
channel = "1.95"
components = ["rustfmt", "clippy"]
# M4-1（2026-11-26）起双架构：x64 与 x86 是同一份源码的两条腿，targets 必须都在。
# 只加 target 不加 crate 特性不能出 32 位包；.cargo/config.toml 的 i686 crt-static 段也必须同步解开。
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]
