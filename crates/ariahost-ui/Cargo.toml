[package]
name = "ariahost-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AriaHost 面板（eframe/egui）：M2 技术闸门 + M2-1 真实状态（SCM/aria2 RPC）"

[dependencies]
ariahost-common = { path = "../ariahost-common" }
# M2-2b：面板自己托管 aria2c（启动/停止），不复用 CLI 的 `--aria2-runtime-selftest` 逻辑。
# core 已经在二进制里（cli 用到），这里只是让 ui 也能调；不新增任何传递依赖。
ariahost-core = { path = "../ariahost-core" }
ariahost-aria2 = { path = "../ariahost-aria2" }
ariahost-svc = { path = "../ariahost-svc" }

# EG-1：egui 整条栈 pin 0.37（防版本漂移）；eframe 默认 features 已含 wgpu 与 system_fonts。
eframe.workspace = true
egui.workspace = true
egui_system_font_provider.workspace = true
# EG-8：任务列表虚拟化（`TableBuilder::body().rows()`）。默认 features 已关，只留 Table。
egui_extras.workspace = true
# 窗口状态（%LOCALAPPDATA%\AriaHost\window.json）的读写；工作区已有同一套 serde，不新增供应链。
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# M2-3：托盘图标（只 Windows 目标；Linux 侧 WSL 的 cargo check 不进这条分支）。
tray-icon.workspace = true
# EG-4 内存口径：K32GetProcessMemoryInfo → PROCESS_MEMORY_COUNTERS_EX2.PrivateWorkingSetSize
# （≈任务管理器「内存」列）。只用官方轻量绑定 windows-sys（已在依赖树内：winit/wgpu 间接依赖），
# 不引入 windows crate，也不新增供应链面。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
