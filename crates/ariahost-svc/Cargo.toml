[package]
name = "ariahost-svc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AriaHost ServiceHost：SCM 托管 + aria2c 子进程生命周期"

[dependencies]
ariahost-common = { path = "../ariahost-common" }
# M1-2B 唯一新增依赖：服务模式复用 ariahost-core 的 aria2c 托管（runtime）。
ariahost-core = { path = "../ariahost-core" }
# M5-e：服务侧状态文件（status.json）的序列化。两者都是 workspace 既有依赖
# （版本不新增、不改根 Cargo.toml），与 core 用同一套 serde 栈，不引入第二套 JSON 实现。
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
# M5-f：把 `Parameters\ConfigPath` 写进 HKLM（安装/卸载链路）。
# feature 只在**本 crate**追加（与 ariahost-common 同一做法）：不改根 Cargo.toml、
# 不新增依赖、Cargo.lock 版本零变化。
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }
