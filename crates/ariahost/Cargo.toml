[package]
name = "ariahost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AriaHost 单二进制入口：面板/服务/短命助手"

[[bin]]
name = "ariahost"
path = "src/main.rs"

[build-dependencies]
# 把图标与版本资源写进 ariahost.exe（仅 Windows 目标；见 build.rs）
winresource = "0.1"

[dependencies]
ariahost-common = { path = "../ariahost-common" }
ariahost-core = { path = "../ariahost-core" }
ariahost-svc = { path = "../ariahost-svc" }
# M2-3：`--web-selftest` 接 M2-5 的网页管理页自检（同仓 path 依赖）。
ariahost-web = { path = "../ariahost-web" }
# 面板入口：M2 起「无参数启动」真的开窗（含 --panel-selftest 隐藏自测入口）。
ariahost-ui = { path = "../ariahost-ui" }

# `--write-aumid` 的 COM 调用（`SHGetPropertyStoreFromParsingName` + 手写 IPropertyStore
# vtable）：只有 Windows 目标需要。特性按需单独开，不摊到其它 crate 上。
# `Win32_System_Console` = GUI 子系统下按需 `AttachConsole`（`console.rs`）；
# `Win32_Storage_FileSystem` = 判断 stdout 是否已被重定向（`GetFileType`）。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_Shell_PropertiesSystem",
] }
