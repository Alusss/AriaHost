[package]
name = "ariahost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AriaHost 单二进制入口：面板/服务/短命助手"

[[bin]]
name = "ariahost"
path = "src/main.rs"

[build-dependencies]
# 把图标与版本资源写进 ariahost.exe（仅 Windows 目标；见 build.rs）
winresource = "0.1"

[dependencies]
ariahost-common = { path = "../ariahost-common" }
ariahost-svc = { path = "../ariahost-svc" }
