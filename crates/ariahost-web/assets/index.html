<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AriaHost 下载任务</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>AriaHost 下载任务</h1>
  <p id="status" class="status">连接中…</p>
</header>

<main>
  <form id="add" class="add card" autocomplete="off">
    <input id="url" type="text" name="url" placeholder="粘贴下载链接（http / https / ftp / magnet）" required>
    <button type="submit">添加</button>
  </form>

  <p id="notice" class="notice" hidden></p>

  <section class="card">
    <h2>任务列表</h2>
    <table>
      <thead>
        <tr><th>任务</th><th>进度</th><th>速度</th><th>剩余</th><th>操作</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>还没有任务。</p>
  </section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
