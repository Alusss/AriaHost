# 一次性诊断 v2：确认 makensis 的 File 指令在 windows-latest 上到底能不能读到 D:\a 下的文件。
# 用法：gh workflow run debug-nsis2.yml，看完日志后删除本文件。
name: debug-nsis2
on:
  workflow_dispatch:

jobs:
  probe:
    name: makensis File 读取能力探针
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 环境与文件系统事实
        shell: pwsh
        run: |
          "PSLocation        = $((Get-Location).Path)"
          "[Environment]::CWD = $([Environment]::CurrentDirectory)"
          New-Item -ItemType Directory -Force dist/x64 | Out-Null
          Set-Content -Path dist/x64/ariahost.exe -Value 'stub-payload' -NoNewline
          $abs = (Get-Item 'dist/x64/ariahost.exe').FullName
          "FullName           = $abs"
          "[IO.File]::Exists  = " + [IO.File]::Exists($abs)
          "Length             = " + (Get-Item 'dist/x64/ariahost.exe').Length
          "attrs              = " + (Get-Item 'dist/x64/ariahost.exe').Attributes
          cmd /c dir "$abs"
          # 副本到 C 盘，用来区分「D:\a 盘符/权限问题」与「makensis 本身问题」
          Copy-Item 'dist/x64/ariahost.exe' 'C:\ariahost-probe.exe' -Force
          "[IO.File]::Exists(C:) = " + [IO.File]::Exists('C:\ariahost-probe.exe')
          "PROBE_ABS=$abs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 定位 makensis
        shell: pwsh
        run: |
          $c = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          $nsis = $c | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { choco install nsis --no-progress -y; $nsis = $c | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          "makensis          = $nsis"
          "FileVersion       = " + (Get-Item $nsis).VersionInfo.FileVersion
          "MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 最小脚本矩阵（4 种路径写法）
        shell: pwsh
        run: |
          $mk = $env:MAKENSIS
          $abs = $env:PROBE_ABS
          New-Item -ItemType Directory -Force out | Out-Null

          function Try-Case([string]$name, [string]$fileSpec) {
            $nsi = Join-Path $PWD "out/$name.nsi"
            $out = Join-Path $PWD "out/$name-setup.exe"
            @(
              "OutFile `"$($out -replace '\\','/')`""
              "InstallDir `"`$TEMP\probe-$name`""
              "Section `"s`""
              "  SetOutPath `"`$INSTDIR`""
              "  File `"$fileSpec`""
              "SectionEnd"
            ) | Set-Content -Encoding utf8 $nsi
            "`n--- 用例 $name : File `"$fileSpec`" ---"
            $o = & $mk /V3 /INPUTCHARSET UTF8 $nsi 2>&1 | Out-String
            $o.Trim() -split "`n" | Select-Object -Last 6
            "exit = $LASTEXITCODE / 产物存在 = " + (Test-Path $out)
          }

          # ① 绝对路径 + 反斜杠（D:\a）
          Try-Case 'a-abs-bslash' $abs
          # ② 绝对路径 + 正斜杠（D:/a）
          Try-Case 'b-abs-slash' ($abs -replace '\\','/')
          # ③ 相对路径（相对脚本所在目录 / 相对 CWD）
          Try-Case 'c-relative' 'dist\x64\ariahost.exe'
          # ④ C 盘绝对路径
          Try-Case 'd-c-drive' 'C:\ariahost-probe.exe'

      - name: 容器内 <-> 宿主机路径差异
        if: always()
        shell: pwsh
        run: |
          "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
          "RUNNER_TEMP      = $env:RUNNER_TEMP"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, Free -AutoSize | Out-String
          "--- D:\a 根 ---"
          cmd /c dir D:\a
          "--- 09 复制到 RUNNER_TEMP 再试一次 ---"
          Copy-Item "$env:GITHUB_WORKSPACE\dist\x64\ariahost.exe" "$env:RUNNER_TEMP\ariahost-probe2.exe" -Force
          $nsi = Join-Path $env:RUNNER_TEMP 'e.nsi'
          $out = Join-Path $env:RUNNER_TEMP 'e-setup.exe'
          @(
            "OutFile `"$($out -replace '\\','/')`""
            "InstallDir `"`$TEMP\probe-e`""
            "Section `"s`""
            "  SetOutPath `"`$INSTDIR`""
            "  File `"$((Join-Path $env:RUNNER_TEMP 'ariahost-probe2.exe') -replace '\\','/')`""
            "SectionEnd"
          ) | Set-Content -Encoding utf8 $nsi
          & $env:MAKENSIS /V3 /INPUTCHARSET UTF8 $nsi 2>&1 | Select-Object -Last 5
          "exit = $LASTEXITCODE / 产物存在 = " + (Test-Path $out)
