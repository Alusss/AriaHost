# AriaHost — CI 质量门禁（private 仓库 / 配额收敛版）
#
# 计费前提：本仓库是 **private**，Windows runner 按 **2× 分钟**计费；
# GitHub Free 的 2000 分钟/月 ≈ **1000 分钟**实际 Windows 构建时间。
# M4-1（2026-11-26）起双架构，但 32 位腿**不跟每次 push 跑**（见下面的触发策略与
# docs/dev/ci.md §2 的账单表）：x64 腿每轮约 26 计费分钟，两条腿都跑 ≈ 58 分钟/轮，
# 按月 30 次就冲破 1000 分钟额度。所以 32 位腿只在「定时全量 / 手动指定 / 夜间全量」
# 三种时机跑，其余时候 skip——**skip 不等于砍掉**，`ci-gate` 把它当通过但保持可见。
#
# 省分钟的机制：
#   1. 宿主 arch 只跑一条腿（x64：clippy → test → build 串行，共用一次工具链与缓存）；
#      32 位腿是独立 job，仅在定时/手动/发布时启动，且自带缓存（key 带 arch，不互相污染）；
#   2. concurrency：同一 ref 连续 push 只留最新一次，旧 run 立即取消；
#   3. 路径判定（`changes` job）：纯 docs/**、*.md、.scratch/**、LICENSE 改动跳过所有编译 job；
#   4. 所有 upload-artifact 都带 retention-days: 7。
#
# 关于「为什么不用 on.push.paths-ignore」：paths-ignore 会让整个 workflow 根本不触发，
# 于是 PR 上连一个 CI 状态都没有（分支保护会一直 pending）。改成「workflow 总是触发 +
# 编译 job 按判定跳过」，语义等价而状态始终存在（见 docs/dev/ci.md §1）。
#
# 现状：仓库尚无 Cargo.toml / crates/，`preflight` 在 M1 之前会明确失败（红色，属预期，
# 不是流水线故障）——避免「绿色空跑」制造已经验证过的假象。
#
# 安装脚本的**编译期**闸门在 `windows` job 里（用 cargo 真实产出的 ariahost.exe 跑一次
# makensis）。**不要**再用 ubuntu + stub 版本：2026-11-25 实证 Linux 版 makensis 接受
# 正斜杠路径、Windows 版不接受，Linux 绿灯对 Windows 没有一点证明力（首发 tag 因此失败）。
#
# 本 workflow 已真实运行（2026-11-24 首次），一切以 Actions 日志为准。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_x86:
        description: "同时跑 32 位腿（clippy + test + build + dumpbin；默认关，省 2× 分钟）"
        type: boolean
        default: false
  schedule:
    # 每周日 18:00 UTC 全量跑一次（含 32 位腿）。32 位是发版产物，
    # 不给它定期实证就会「静默烂掉」；每周一次在预算内（约 +8 计费分钟/周）。
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 改动范围判定。只影响文档/许可证的改动 → code=false，编译 job 全部 skip。
  # 拿不准时一律 code=true：多跑一次比漏跑安全。
  changes:
    name: changes / 改动范围判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: 判定是否触及代码或构建配置
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}...HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}...HEAD"
          else
            echo "无法确定 base commit（事件=$EVENT），按代码改动处理。"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "比较范围：$range"
          git diff --name-only "$range" > changed.txt || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "--- 本次改动文件 ---"
          cat changed.txt
          # 「不影响编译」的路径白名单（新增顶层目录时记得同步这里）：
          #   docs/**、.scratch/**、任意 *.md、根 LICENSE / LICENSE-*、.gitignore、.editorconfig
          if [ -s changed.txt ] \
             && ! grep -Ev '^(docs/|\.scratch/)|\.md$|(^|/)LICENSE(-[A-Za-z]+)?$|^\.gitignore$|^\.editorconfig$' changed.txt > /dev/null; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "仅文档/许可证改动：跳过 fmt / clippy / test / build。"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "涉及代码或构建配置：跑编译 job。"
          fi

  # 永远跑的轻量检查（ubuntu，约 30–60 秒）：让纯文档 PR 也有 CI 状态，
  # 同时挡住两类真实事故：①pwsh Set-Content/Out-File 把中文写成 GBK（留下 U+FFFD）；
  # ②YAML 里出现制表符（GitHub 直接拒绝解析）。
  meta:
    name: meta / YAML 与文本编码检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 编码与 YAML 静态检查
        shell: bash
        run: |
          set -uo pipefail
          fail=0

          echo "== 1) 扫描 U+FFFD（错误编码读写留下的替换字符）=="
          if grep -rIl --exclude-dir=.git $'\xef\xbf\xbd' \
               --include='*.md' --include='*.yml' --include='*.yaml' --include='*.toml' \
               --include='*.nsi' --include='*.rs' . 2>/dev/null; then
            echo "::error::上列文件含 U+FFFD：多半是被以错误编码写过（典型：pwsh Set-Content/Out-File 写 UTF-8 中文）。请用 write/edit 工具重写这些文件。"
            fail=1
          else
            echo "OK：未发现 U+FFFD"
          fi

          echo "== 2) 扫描 YAML 中的制表符（YAML 不允许 tab 缩进）=="
          if grep -rInP --exclude-dir=.git '\t' --include='*.yml' --include='*.yaml' . 2>/dev/null; then
            echo "::error::YAML 文件含制表符，GitHub 会拒绝解析。"
            fail=1
          else
            echo "OK：YAML 无制表符"
          fi

          echo "== 3) 解析 .github/workflows/*.yml =="
          # 为什么不用 pip：ubuntu 24.04 的 Python 受 PEP 668（externally-managed-environment）
          # 保护，`pip install pyyaml` 可能直接被拒 → `meta` 每次 run 都红，而 gate 依赖它，
          # 等于每次 push 白烧 ubuntu 分钟还可能阻塞合并。runner 镜像自带 Ruby，Psych 是标准库。
          # 用 Psych.parse_file 而不是 YAML.load_file：只做语法解析、不实例化对象，
          # 不受 Psych 4 的 safe_load 允许类/别名限制影响（workflow 里也没有锚点）。
          if command -v ruby >/dev/null 2>&1; then
            for f in .github/workflows/*.yml; do
              if ruby -rpsych -e 'Psych.parse_file(ARGV[0])' "$f" 2>/tmp/yaml_err.txt; then
                echo "OK: $f"
              else
                echo "::error file=$f::YAML 解析失败：$(tr '\n' ' ' < /tmp/yaml_err.txt)"
                fail=1
              fi
            done
          else
            echo "::error::runner 上没有 ruby，YAML 解析校验无法执行（不要退回 pip，原因见上）。"
            fail=1
          fi

          echo "== 4) 工具链 pin 一致性（rust-toolchain.toml ↔ workflow 的 toolchain 输入）=="
          # 为什么必须显式传 toolchain：dtolnay/rust-toolchain 的 `toolchain` 输入默认值就是
          # **stable**（分支名）。不传时它先装一份 stable，随后 rustup 又按 rust-toolchain.toml
          # 补装 1.95 → 每个含工具链的 job 多下一整套（≈1.5–3 分钟 ×2 计费），而且
          # steps.toolchain.outputs.cachekey 是 stable 的哈希（pin 升级不换缓存 key）。
          # 因此三处都显式传 toolchain，并在下面断言「toml 的 channel == workflow 里的值」。
          pin_channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
          if [ -z "$pin_channel" ]; then
            echo "::error file=rust-toolchain.toml::没有解析到 channel（形如 channel = 1.95 的带引号写法）。"
            fail=1
          else
            pin_seen=0
            for f in .github/workflows/*.yml; do
              while IFS= read -r val; do
                [ -z "$val" ] && continue
                pin_seen=$((pin_seen + 1))
                if [ "$val" != "$pin_channel" ]; then
                  echo "::error file=$f::toolchain 输入=$val，与 rust-toolchain.toml 的 channel=$pin_channel 不一致（升级工具链时两处一起改）。"
                  fail=1
                fi
              done <<< "$(sed -nE 's/^[[:space:]]*toolchain:[[:space:]]*"([^"]+)".*/\1/p' "$f")"
            done
            if [ "$pin_seen" -eq 0 ]; then
              echo "::error::没有任何 workflow 显式传 toolchain 输入：@stable 会把 stable 装进来（见上）。"
              fail=1
            else
              echo "OK：$pin_seen 处 toolchain 输入都等于 $pin_channel"
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "静态检查未通过。"
            exit 1
          fi
          echo "静态检查全部通过。"

  # 单一前置闸门：没有 Rust 工程就明确报错，其余编译 job 全部 skipped，ci-gate 汇总为红。
  preflight:
    name: preflight / 工程存在性
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查 workspace 是否存在
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Cargo.toml ]; then
            echo "::error::仓库尚无 Cargo.toml。本 CI 是 M1 之后的门禁，当前失败属预期（docs/dev/ci.md）。"
            exit 1
          fi
          if [ ! -f Cargo.lock ]; then
            echo "::warning::缺少 Cargo.lock：后续 --locked 构建会失败，请把 Cargo.lock 提交进仓库。"
          fi
          echo "workspace 存在，继续。"

  fmt:
    name: cargo fmt --check
    needs: [changes, preflight]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 必须显式传 toolchain：该 action 的 toolchain 输入默认是 stable，不传会先装 stable、
      # 再由 rustup 按 rust-toolchain.toml 补装第二份（多下一次完整工具链，且 cachekey 反映 stable）。
      # components/targets 不传：它们由 rust-toolchain.toml 声明，rustup 首次调用时按需补装。
      # 版本号与 rust-toolchain.toml 的 channel 必须一致 —— meta job 的检查 4 会断言这一点。
      - name: 安装 Rust（显式传 toolchain 输入，版本与 rust-toolchain.toml 一致）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - name: 校验工具链 pin 生效（rustc 1.95.x）
        shell: bash
        run: |
          set -euo pipefail
          rustc -V
          case "$(rustc -V)" in
            "rustc 1.95."*) echo "OK：rustc 与 rust-toolchain.toml 的 channel = 1.95 一致" ;;
            *) echo "::error::rustc 版本与 rust-toolchain.toml 不符：$(rustc -V)。检查 action 的 toolchain 输入与 toml 的 channel 是否漂了。"; exit 1 ;;
          esac
      - name: 格式检查
        run: cargo fmt --all -- --check

  # Windows 侧只留一个 job：clippy → test → build 串行，共用一次 checkout / 工具链安装 / 缓存。
  # 拆成三个 job 会让每份工作重复「装工具链 + 拉缓存 + 全量编译依赖」，在 2× 计费的私有仓里不划算。
  # 代价：clippy 不过就不跑 test/build（先修上游）。
  windows:
    name: windows / x64（clippy + test + build）
    needs: [changes, preflight]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # M2 起面板引入 egui/eframe + wgpu 整条栈（wgpu-core/naga/winit/fontique/skrifa…），
    # 首次全量编译预计 12–20 分钟（缓存命中后 3–5 分钟），原 30 分钟余量不够；
    # 提到 45 分钟，避免首次跑因超时被判红（超时同样按 2× 计费，白烧两次）。其它 job 不动。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # 必须显式传 toolchain（同 fmt job）：不传时该 action 默认装 stable，再由 rustup 补装
      # rust-toolchain.toml 的 1.95 → 这是本 workflow 里最贵的一处重复下载。
      # targets/components 不传，由 rust-toolchain.toml 声明。
      - name: 安装 Rust（显式传 toolchain 输入，版本与 rust-toolchain.toml 一致）
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      # crates/ariahost/build.rs 用 winresource 嵌图标与版本资源，MSVC 目标下要 Windows SDK 的
      # rc.exe。它自己的查找顺序是 RC_PATH → WindowsSdkVerBinPath → 注册表 KitsRoot10（不走 PATH），
      # 这一步把 VS 的 x64 开发环境导入本 job 的后续步骤作为兜底。
      - name: 导入 MSVC 开发环境（rc.exe，供 build.rs 的 winresource 使用）
        uses: ilammy/msvc-dev-cmd@v1
      - name: 校验工具链 pin 与 target（rustc 1.95.x / x64 + x86）
        shell: bash
        run: |
          set -euo pipefail
          rustc -V
          cargo -V
          case "$(rustc -V)" in
            "rustc 1.95."*) echo "OK：rustc 与 rust-toolchain.toml 的 channel = 1.95 一致" ;;
            *) echo "::error::rustc 版本与 rust-toolchain.toml 不符：$(rustc -V)。检查 action 的 toolchain 输入与 toml 的 channel 是否漂了。"; exit 1 ;;
          esac
          # 只打印不断言会给人「target 已验证」的错觉；这里改成硬断言。
          rustup target list --installed | tr -d '\r'
          # M4-1 起双架构：缺任一 target 都硬失败（32 位是发版产物，不是可选实验）
          for t in x86_64-pc-windows-msvc i686-pc-windows-msvc; do
            rustup target list --installed | tr -d '\r' | grep -qx "$t" \
              || { echo "::error::未安装 $t target（应由 rust-toolchain.toml 的 targets 提供）。"; exit 1; }
          done
          echo "OK：x86_64-pc-windows-msvc 与 i686-pc-windows-msvc 均已安装"
      - name: 缓存 registry 与 target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # key 同时含 Cargo.lock 指纹与 rustc 版本指纹（dtolnay action 的 cachekey），
          # 依赖变更或工具链升级都会换 key；target 目录不跨 job 共享（本 workflow 只有一个 Windows job）。
          key: ${{ runner.os }}-x64-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
          restore-keys: |
            ${{ runner.os }}-x64-
      - name: Clippy（warnings 即错误）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 单元 + 集成测试
        run: cargo test --workspace --locked
      - name: Release 构建（x64）
        run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      # 32 位的**编译/测试证据不在这一腿里**：见下面独立的 `windows-x86` job。
      # 这里刻意不加 `cargo check --target i686`——它会给每次 push 多烧 3–5 分钟 2× 计费，
      # 而真正的 32 位 clippy/test/build 已经在定时/手动/发布三条时机上真跑（含 dumpbin）。
      - name: 校验主程序产物（+ 静态 CRT 快检）
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/ariahost.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "缺少 $exe：请确认某个 crate 声明了 [[bin]] name = `"ariahost`"。"
            exit 1
          }
          Get-Item $exe | Select-Object Name, Length
          # ---- 静态 CRT 门禁（验收 #15a）：硬失败，不是提示 ----
          # 旧写法「找不到 dumpbin 或命中依赖都只 ::warning::」会让 ci-gate 变绿而 #15a 实际
          # 没过——这是最实在的一处假绿。现在两种失败都 exit 1。
          # 定位方式：vswhere 取 VS 安装路径 → VC\Tools\MSVC\<ver>\bin\Hostx64\x64\dumpbin.exe；
          # 兜底的 Get-Command 只对「dumpbin 已在 PATH」的情况有用。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vsPath) {
              $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'
              if (Test-Path $msvcRoot) {
                $cand = Get-ChildItem -Path $msvcRoot -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
                  Sort-Object FullName -Descending | Select-Object -First 1
                if ($cand) { $dumpbin = $cand.FullName }
              }
            }
          }
          if (-not $dumpbin) {
            $cmd = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
            if ($cmd) { $dumpbin = $cmd.Source }
          }
          if (-not $dumpbin) {
            Write-Host "::error::未找到 dumpbin.exe（vswhere 与 PATH 都没有）→ 无法验证验收 #15a，按失败处理。"
            exit 1
          }
          Write-Host "dumpbin = $dumpbin"
          $deps = (& $dumpbin /dependents $exe 2>&1 | Out-String)
          Write-Host $deps
          $hit = @($deps -split "\r?\n" | Where-Object { $_ -match 'VCRUNTIME140|MSVCP140' })
          if ($hit.Count -gt 0) {
            Write-Host "::error::产物仍依赖动态 CRT（+crt-static 可能未生效）：验收 #15a 未通过。"
            $hit | ForEach-Object { Write-Host $_.Trim() }
            exit 1
          }
          Write-Host "OK：dumpbin 未发现 VCRUNTIME140 / MSVCP140 依赖（#15a 本次通过）。"
          # ---- 版本资源门禁：证明 crates/ariahost/build.rs（winresource）真的写进了 exe ----
          # 只打印不足以防回归，所以对 ProductName 做硬断言；其余字段打印出来供人工核对。
          $vi = (Get-Item $exe).VersionInfo
          $vi | Format-List ProductName,FileVersion,ProductVersion,FileDescription,CompanyName,LegalCopyright,OriginalFilename,InternalName
          if ($vi.ProductName -ne 'AriaHost') {
            Write-Host "::error::exe 的 ProductName=「$($vi.ProductName)」，不是 AriaHost：版本资源未嵌入（检查 crates/ariahost/build.rs 与 rc.exe 是否可用）。"
            exit 1
          }
          if ($vi.LegalCopyright -notlike '*2026 Alusss*') {
            Write-Host "::error::exe 的 LegalCopyright=「$($vi.LegalCopyright)」，与 build.rs 设定的「Copyright (c) 2026 Alusss」不符。"
            exit 1
          }
          Write-Host "OK：exe 的 VersionInfo 来自 build.rs（ProductName=AriaHost，LegalCopyright 含 2026 Alusss）。"
      # 安装脚本编译门禁（**必须在 Windows 上跑**，2026-11-25 实测结论）。
      # 历史教训：本节曾是一个 ubuntu + stub 的独立 job，它用正斜杠绝对路径编译"通过"了，
      # 于是被当成"安装脚本可编译"的证据；结果首发 tag v0.1.0 的 release build 在
      # makensis 上因 `File: ... -> no files found` 直接失败（run 45451494558）。
      # 实测（run 45452855606）：Windows 版 makensis 的 File 只接受**全反斜杠绝对路径**，
      # 正斜杠会被当作字面字符 → 在 Linux 上绿不能推出在 Windows 上绿。
      # 所以：① 平台必须是 Windows；② 载荷必须是 cargo 真实产出的 ariahost.exe；
      # ③ 与 release.yml 传同一套 /D 参数（含反斜杠绝对路径）。
      # NSIS 获取策略（task-79）：**缓存优先 → choco 钉版本重试 → 版本漂移断言**。
      # 为什么不再「镜像预装就用、没有就 choco 装一次」：2026-11-26 发 v0.1.3 时
      # community.chocolatey.org 抖 503，CI 与 release 两条线同时红，且红点都落在
      # 整条 Windows 编译**之后**——私有仓分钟数按 2 倍计费，一次上游抖动就烧掉两轮
      # 全量编译。缓存命中时这一步是纯本地解包，零网络。
      - name: 缓存 NSIS（版本钉 3.13.0）
        id: nsis-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-3.13.0-${{ runner.os }}
      - name: 安装 NSIS（缓存未命中：SourceForge 便携包优先，choco 仅兜底）
        shell: pwsh
        run: |
          if ("${{ steps.nsis-cache.outputs.cache-hit }}" -eq "true") {
            Write-Host "NSIS 命中缓存（key=nsis-3.13.0-${{ runner.os }}），跳过安装"
            exit 0
          }
          $dest = "${env:ProgramFiles(x86)}\NSIS"
          # 线路 1（首选）：SourceForge 便携 zip，钉 SHA-256。理由：2026-11-26 发 v0.1.3 时
          # chocolatey.org 先 503 后 504，两次都让 Windows 两条腿在**整条编译之后**才红；
          # SourceForge 与 chocolatey.org 不在同一条依赖链上，且这份 zip 就是 NSIS 官方
          # 发布渠道（同版本同字节，本机实测用它能编译本项目 .nsi）。
          # 布局注意：zip 里真正的 makensis 在 `Bin\` 下。**不要**把它挪到安装根——实测挪
          # 到根会以 0xC0000135（STATUS_DLL_NOT_FOUND）退出；根的 2.5 KB `makensis.exe`
          # 是官方转发器，`/VERSION` 也能正常回 v3.13。
          $url  = "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
          $want = "BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8"
          $zip  = Join-Path $env:RUNNER_TEMP "nsis-3.13.zip"
          $ok = $false
          for ($i = 0; $i -lt 2; $i++) {
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            curl.exe -L --retry 3 --retry-connrefused --max-time 180 -sS -o $zip $url
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "便携包下载失败（curl exit $LASTEXITCODE），第 $($i + 1)/2 次"
              Start-Sleep -Seconds 5
              continue
            }
            $got = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash
            if ($got -ne $want) {
              Write-Warning "便携包 SHA-256 不匹配：期望 $want，实际 $got（第 $($i + 1)/2 次）"
              Start-Sleep -Seconds 5
              continue
            }
            $ok = $true
            break
          }
          if ($ok) {
            $tmp = Join-Path $env:RUNNER_TEMP "nsis-x"
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $tmp -Force
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item (Join-Path $tmp "nsis-3.13\*") $dest -Recurse -Force
            if (Test-Path (Join-Path $dest "Bin\makensis.exe")) {
              Write-Host "NSIS 就绪（SourceForge 便携包，SHA-256 已核对；makensis 在 Bin\ 下）"
              exit 0
            }
            Write-Warning "便携包解包后没有 Bin\makensis.exe，转 choco 兜底"
          }
          # 线路 2（兜底）：choco 钉版本 + 3 次重试。
          # 退避阶梯按任务书钉成 10s / 30s / 60s。**只有「还有下一次」才退避**：
          # 3 次尝试只消耗前两档，第 3 次失败会立刻 fail-closed——若按 `$i -lt $waits.Count`
          # 判断，第 3 次失败后还要白等 60s 才退出（本地模拟实测到这一点，已修）。
          # 写成 $attempts-1 的好处：将来提到 4 次尝试，60s 档自动生效，不必改两处。
          $waits = @(10, 30, 60)
          $attempts = 3
          for ($i = 0; $i -lt $attempts; $i++) {
            Write-Host "::group::choco install nsis --version=3.13.0（第 $($i + 1)/$attempts 次）"
            choco install nsis --version=3.13.0 --no-progress -y
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { Write-Host "choco 安装成功（第 $($i + 1) 次）"; exit 0 }
            Write-Warning "第 $($i + 1) 次失败（exit $code）"
            if ($i -lt ($attempts - 1)) {
              Write-Host "等待 $($waits[$i]) s 后重试（503 多为上游瞬时抖动，退避一次往往就好）"
              Start-Sleep -Seconds $waits[$i]
            }
          }
          Write-Error "两条线路全失败：SourceForge 便携包不可用，choco 3 次也失败。没有 makensis 就出不了安装包，本步 fail-closed"
          exit 1
      - name: 安装脚本编译门禁（makensis，真实载荷）
        shell: pwsh
        run: |
          function Find-Makensis {
            # 两种布局都认：便携包的真二进制在 `Bin\` 下（根的是转发器）；choco 布局
            # 直接把 makensis.exe 放在安装根。
            $c = @(
              "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\Bin\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            )
            return $c | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $mk = Find-Makensis
          if (-not $mk) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $mk = $cmd.Source }
          }
          if (-not $mk) { Write-Error "makensis 未找到（便携包与 choco 两条线路都失败？）"; exit 1 }
          # 版本漂移断言：缓存键写的是 3.13.0，但缓存也可能被同名键的旧内容污染；
          # 任何偏离都在这里立刻红，别等到出包比版本才发现差异。
          # **不能只看 FileVersion**：便携包的 `Bin\makensis.exe` 没有版本资源（实测为空），
          # 所以以 `/VERSION` 的运行时输出为准，FileVersion 仅作兜底。
          $probe = (& $mk /VERSION 2>&1 | Out-String).Trim()
          $ver = (Get-Item $mk).VersionInfo.FileVersion
          $probeOk = ($probe -match '3\.13')
          $fileOk = ($ver -and $ver.StartsWith("3.13"))
          if (-not ($probeOk -or $fileOk)) {
            Write-Error "makensis 版本漂移：期望 3.13.x，/VERSION='$probe'，FileVersion='$ver'（路径 $mk）"
            exit 1
          }
          Write-Host "MAKENSIS=$mk（/VERSION='$probe' / FileVersion='$ver'）"
          $src = Join-Path $PWD "dist\x64"
          $out = Join-Path $PWD "dist\AriaHost-0.0.0-ci-x64-setup.exe"
          New-Item -ItemType Directory -Force $src | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/ariahost.exe" (Join-Path $src "ariahost.exe") -Force
          if (-not (Test-Path (Join-Path $src "ariahost.exe"))) { Write-Error "载荷暂存失败"; exit 1 }
          # 图标也要进 SRCDIR：ariahost.nsi 的 MUI_ICON / Icon / File 都按 "${SRCDIR}\ariahost.ico"
          # 取文件，缺了会报 "no files found"（与 exe 载荷同一套编译期路径规则）。
          Copy-Item "installer/ariahost.ico" (Join-Path $src "ariahost.ico") -Force
          if (-not (Test-Path (Join-Path $src "ariahost.ico"))) { Write-Error "图标暂存失败（installer/ariahost.ico 缺失）"; exit 1 }
          Write-Host "SRCDIR = $src（**无核心**：只给负向断言与 NO_BUNDLED 变体用）"
          # 许可与来源文件是**仓库文件**（NSI 按相对路径直取，不经流水线暂存）：
          # 先在这里确认存在，否则 makensis 只会甩一句 "no files found"，信息量太差。
          foreach ($f in @("installer/licenses/aria2-COPYING.txt", "THIRD-PARTY-NOTICES.md")) {
            if (-not (Test-Path $f)) { Write-Error "缺少 $f（内置核心的 GPLv2 随附义务）"; exit 1 }
          }

          # ---- 1) 默认路径：本安装包**必须**带核心（task-54 B3：默认 fail-closed）。
          # 用一个 4 字节假核心把 `!if /FileExists` 的**真分支**点着，证明：有载荷时可编译，
          # 且许可随附的两条 File（licenses\aria2-COPYING.txt、..\THIRD-PARTY-NOTICES.md）
          # 路径正确——这两条只在这个分支里被解析，默认载荷下永远碰不到。
          $srcCore = Join-Path $PWD "dist\x64-core"
          New-Item -ItemType Directory -Force $srcCore | Out-Null
          Copy-Item (Join-Path $src "ariahost.exe") (Join-Path $srcCore "ariahost.exe") -Force
          Copy-Item (Join-Path $src "ariahost.ico") (Join-Path $srcCore "ariahost.ico") -Force
          Set-Content -Path (Join-Path $srcCore "aria2c.exe") -Value "stub-core" -Encoding ascii
          & $mk /V2 /INPUTCHARSET UTF8 /DVERSION=0.0.0-ci /DVI_VERSION=0.0.0.0 /DARCH=x64 "/DSRCDIR=$srcCore" "/DOUTFILE=$out" "installer\ariahost.nsi"
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis 失败（exit $LASTEXITCODE）"; exit $LASTEXITCODE }
          $item = Get-Item $out
          # 下限守卫：空包/极小包通常说明 File 没把载荷打进去（正是本次事故的形态）。
          if ($item.Length -lt 100000) { Write-Error "安装包异常小（$($item.Length) B），载荷疑似未打入"; exit 1 }
          Write-Host "OK：默认（必带核心）编译通过，$($item.Name) / $($item.Length) 字节"

          # ---- 2) /DTRACE 变体（只编译、不运行）：TRACE 整段被 !ifdef TRACE 包住，
          # 默认编译碰不到，只在本地手验过等于没门禁。
          $outTrace = Join-Path $PWD "dist\AriaHost-0.0.0-ci-x64-setup-trace.exe"
          & $mk /V2 /INPUTCHARSET UTF8 /DVERSION=0.0.0-ci /DVI_VERSION=0.0.0.0 /DARCH=x64 "/DSRCDIR=$srcCore" "/DOUTFILE=$outTrace" "/DTRACE=$PWD\dist\ariahost-trace.txt" "installer\ariahost.nsi"
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis（/DTRACE 变体）失败（exit $LASTEXITCODE）"; exit $LASTEXITCODE }
          Write-Host "OK：/DTRACE 变体编译通过（$((Get-Item $outTrace).Length) 字节）"

          # ---- 3) 显式豁免变体：/DNO_BUNDLED_ARIA2=1 + 无核心载荷 → 必须编译成功。
          # 这一条同时证明「无核心包只能显式产出」的另一半：`!ifdef NO_BUNDLED_ARIA2`
          # 分支与它的 Finish 页文案（"未内置核心，首次启动需联网下载"）语法正确。
          $outNoBundle = Join-Path $PWD "dist\AriaHost-0.0.0-ci-x64-setup-nobundle.exe"
          & $mk /V2 /INPUTCHARSET UTF8 /DVERSION=0.0.0-ci /DVI_VERSION=0.0.0.0 /DARCH=x64 "/DSRCDIR=$src" "/DOUTFILE=$outNoBundle" /DNO_BUNDLED_ARIA2=1 "installer\ariahost.nsi"
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis（/DNO_BUNDLED_ARIA2 变体）失败（exit $LASTEXITCODE）"; exit $LASTEXITCODE }
          Write-Host "OK：显式无核心变体编译通过（$((Get-Item $outNoBundle).Length) 字节）"

          # ---- 4) 负向断言：**默认**（不加任何 define）+ 无核心载荷 → 必须编译失败。
          # 这是 fail-closed 的唯一可信证明。反过来（默认放过、靠 release 记得传 define）
          # 就是 task-61 那种"顺手 makensis 一次"产出无核心包、用户首启才发现的事故形态。
          $outNo = Join-Path $PWD "dist\AriaHost-0.0.0-ci-x64-setup-nocore.exe"
          & $mk /V2 /INPUTCHARSET UTF8 /DVERSION=0.0.0-ci /DVI_VERSION=0.0.0.0 /DARCH=x64 "/DSRCDIR=$src" "/DOUTFILE=$outNo" "installer\ariahost.nsi" 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -eq 0) {
            Write-Error "负向断言失败：缺内置核心却编译成功（exit 0）。默认 fail-closed 已失效——发布可能出「无核心」的包。"
            exit 1
          }
          if (Test-Path $outNo) { Write-Error "负向断言失败：缺核心时仍生成了 $outNo"; exit 1 }
          Write-Host "OK：缺核心时按预期编译失败（默认 fail-closed 生效）"

          # ---- 5) 32 位变体（M4-1）：/DARCH=x86 + 同一份带核心载荷 → 必须编译成功。
          # 32 位包在 .nsi 里走的是「跳过 RunningX64 检查」的那条分支，这段只在
          # ARCH=x86 时被解析；不在这里点着，CI 全绿也证明不了 32 位包装得了。
          $outX86 = Join-Path $PWD "dist\AriaHost-0.0.0-ci-x86-setup.exe"
          & $mk /V2 /INPUTCHARSET UTF8 /DVERSION=0.0.0-ci /DVI_VERSION=0.0.0.0 /DARCH=x86 "/DSRCDIR=$srcCore" "/DOUTFILE=$outX86" "installer\ariahost.nsi"
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis（x86 变体）失败（exit $LASTEXITCODE）"; exit $LASTEXITCODE }
          $itemX86 = Get-Item $outX86
          if ($itemX86.Length -lt 100000) { Write-Error "32 位安装包异常小（$($itemX86.Length) B），载荷疑似未打入"; exit 1 }
          Write-Host "OK：32 位变体编译通过（$($itemX86.Name) / $($itemX86.Length) 字节）"

          # ---- 收尾：把「预期失败」留下的退出码清掉。
          # GitHub Actions 的 powershell 包装器在用户脚本末尾会执行 `exit $LASTEXITCODE`；
          # 上面第 4 步刚跑的是一个**故意失败**的 makensis（退出码 1），不重置的话
          # 整步会在「四条断言全过」的情况下以 1 退出——run 45598611141 正是这样红的：
          # 日志里四条 OK 全在，最后却 `Process completed with exit code 1`。
          $global:LASTEXITCODE = 0
      - name: 上传调试产物（7 天）
        uses: actions/upload-artifact@v4
        with:
          name: ariahost-x64-release
          path: target/x86_64-pc-windows-msvc/release/ariahost.exe
          if-no-files-found: error
          retention-days: 7

  # ── 32 位腿（M4-1）─────────────────────────────────────────────────────────
  # **真跑**（clippy + test + build + dumpbin），不是只编译：runner 是 x64 Windows，
  # 32 位测试二进制可直接执行，所以「测试好」有实际意义。
  #
  # 触发策略（见 docs/dev/ci.md §2 的账单）：PR 与日常 push 都**不**跑它（否则单轮
  # 26→58 计费分钟，30 次/月就破 1000 分钟额度）；只在三种时机跑：
  #   ① 定时（每周日 18:00 UTC）② 手动 dispatch 且 run_x86=true ③ tag 发布（release.yml 的矩阵）。
  # skip 时 `ci-gate` 视为通过（不阻塞合并），但 job 在 Actions 页面里始终可见——
  # 「可见的跳过」和「悄悄砍掉」不是一回事。
  windows-x86:
    name: windows / x86（clippy + test + build + dumpbin）
    needs: [changes, preflight]
    if: |
      needs.changes.outputs.code == 'true'
      && (github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && inputs.run_x86)
          || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust（显式传 toolchain 输入，版本与 rust-toolchain.toml 一致）
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          # i686 是 Tier 1 without host tools：必须由 x64 宿主交叉编译，std 由 action 装入。
          targets: i686-pc-windows-msvc
      - name: 导入 MSVC 开发环境（rc.exe / dumpbin）
        uses: ilammy/msvc-dev-cmd@v1
      - name: 校验 32 位 target 已装入
        shell: bash
        run: |
          set -euo pipefail
          rustc -V
          rustup target list --installed | tr -d '\r' | grep -qx 'i686-pc-windows-msvc' \
            || { echo "::error::未安装 i686-pc-windows-msvc target。"; exit 1; }
          echo "OK：i686-pc-windows-msvc 已安装"
      - name: 缓存 registry 与 target（32 位独立 key）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-x86-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
          restore-keys: |
            ${{ runner.os }}-x86-
      - name: Clippy（32 位，warnings 即错误）
        run: cargo clippy --workspace --all-targets --locked --target i686-pc-windows-msvc -- -D warnings
      - name: 单元 + 集成测试（32 位，真跑）
        run: cargo test --workspace --locked --target i686-pc-windows-msvc
      - name: Release 构建（32 位）
        run: cargo build --workspace --release --locked --target i686-pc-windows-msvc
      - name: 静态 CRT 门禁（32 位产物，dumpbin）
        shell: pwsh
        run: |
          $exe = "target/i686-pc-windows-msvc/release/ariahost.exe"
          if (-not (Test-Path $exe)) { Write-Error "缺少 $exe"; exit 1 }
          Get-Item $exe | Select-Object Name, Length
          $dumpbin = $null
          $cmd = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($cmd) { $dumpbin = $cmd.Source }
          if (-not $dumpbin) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              if ($vs) {
                $cand = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory |
                  Sort-Object Name -Descending |
                  ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\dumpbin.exe' } |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
                if ($cand) { $dumpbin = $cand }
              }
            }
          }
          if (-not $dumpbin) { Write-Error "找不到 dumpbin.exe：32 位静态 CRT 门禁无法执行（不降级为 warning）"; exit 1 }
          $deps = (& $dumpbin /nologo /dependents $exe) | Out-String
          Write-Host $deps
          $bad = @('VCRUNTIME140', 'VCRUNTIME140_1', 'MSVCP140') | Where-Object { $deps -match $_ }
          if ($bad.Count -gt 0) { Write-Error "32 位产物动态链接了 VC++ 运行库（$($bad -join ',')）：静态 CRT 失效，用户机器会缺 DLL"; exit 1 }
          Write-Host "OK：32 位产物只依赖系统 DLL（无 VCRUNTIME/MSVCP）"
      - name: 上传 32 位调试产物（7 天）
        uses: actions/upload-artifact@v4
        with:
          name: ariahost-x86-release
          path: target/i686-pc-windows-msvc/release/ariahost.exe
          if-no-files-found: error
          retention-days: 7

  # 安装脚本的编译期闸门已从 ubuntu（stub）**迁到上面的 windows job**（用真实载荷）。
  # 原因见该步骤上方注释：Linux 绿灯对 Windows 没有证明力（2026-11-25 首发 tag 实证）。
  # 这里不再保留独立 job —— 少一个 job 也少一份"看起来验证过"的错觉。

  # 分支保护只需勾选这一个 job；任一上游 failure / timed_out / cancelled 即红。
  # skipped（文档改动跳过编译）视为通过——否则纯文档 PR 永远无法合并。
  gate:
    name: ci-gate
    if: always()
    needs: [changes, meta, preflight, fmt, windows, windows-x86]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总上游 job 结果
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          bad = []
          for job, info in needs.items():
              result = (info or {}).get('result')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  bad.append(f'{job}={result}')
          if bad:
              print('::error::存在未通过或被取消的 job：' + ', '.join(bad))
              raise SystemExit(1)
          print('全部通过（文档改动时编译 job 为 skipped，属正常）。')
          PY
