# AriaHost — 发布流水线（x64 per-user 单包 + NSIS 安装包）
#
# 触发：推送 v* tag（会创建 GitHub Release）或手动 workflow_dispatch（只出 artifact）。
#
# 计费前提：private 仓库，Windows runner 2× 分钟计费（Free 2000 分钟/月 ≈ 1000 分钟实际构建）。
# 所以本流程**只编 x64 per-user 一个包**；x86 与 /DPER_MACHINE 全机变体在 M4 才进矩阵
# （Q3/Q15，恢复步骤见下方被注释掉的 build-x86 段落）。
#
# 现状：仓库尚无 Rust 工程与 Cargo.toml，本流程待 M1 后首次真跑验证；
# NSIS 脚本 installer/ariahost.nsi 未经本地 makensis 编译（开发机无 NSIS），
# 首次编译结果以 M3 的 CI 日志为准。详见 docs/dev/ci.md 与 docs/dev/release.md。
#
# 为什么这里没有 paths 过滤：tag 推送本身就是一次显式的发布决定，用路径过滤跳过它只会在
# 「忘了改某文件」时造成「打了 tag 却没有 Release」这种更难查的故障。省分钟靠的是
# 「只编一个包 + 7 天 artifact 保留」，不是跳过发布。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v 前缀，如 0.1.0；留空则从 tag 或 Cargo.toml 读取）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Q8 已定首版不签名；配置该 secret 后签名步骤才会出现，见 docs/dev/release.md。
  SIGN_CERT: ${{ secrets.SIGN_CERT_PFX_BASE64 }}

jobs:
  version:
    name: 解析版本 + 元数据自检
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      vi_version: ${{ steps.ver.outputs.vi_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 解析版本号（dispatch input > v* tag > workspace Cargo.toml）
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-}"
          if [ -z "$v" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$v" ] && [ -f Cargo.toml ]; then
            v="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/^[^"]*"([^"]+)".*/\1/' || true)"
          fi
          if [ -z "$v" ]; then
            echo "::error::无法解析版本号：请传 dispatch input、打 v* tag，或在根 Cargo.toml 写 [workspace.package] version。"
            exit 1
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::版本号不是 semver 形式（不带 v 前缀）：$v"
            exit 1
          fi
          # 版本一致性（审计 F8）：本次发布号 vs Cargo.toml 的 [workspace.package] version。
          # 不一致就 exit 1 —— 否则会发出「tag 写 0.1.0、二进制里是 0.2.0」名实不符的包。
          # Cargo.toml 尚未落地时跳过（M1 之前本 job 只做解析，见 ci.md）。
          if [ -f Cargo.toml ]; then
            crate_v="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/^[^"]*"([^"]+)".*/\1/' || true)"
            if [ -z "$crate_v" ]; then
              echo "::error::Cargo.toml 里解析不到 version（[workspace.package] version = x.y.z 的带引号写法）。"
              exit 1
            fi
            if [ "$crate_v" != "$v" ]; then
              echo "::error::版本不一致：本次发布 $v，Cargo.toml 是 $crate_v。改齐再发。"
              exit 1
            fi
            echo "OK：Cargo.toml 版本与本次发布一致（$v）"
          else
            echo "::warning::仓库尚无 Cargo.toml：跳过版本一致性校验（M1 前预期）。"
          fi
          # NSIS 的 VIProductVersion 必须是四段数字，pre-release 后缀在此被截断
          vi="$(sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3.0/' <<< "$v")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "vi_version=$vi" >> "$GITHUB_OUTPUT"
          echo "::notice::version=$v vi_version=$vi"
      # 便宜的常驻自检：把「工具链 pin / 静态 CRT / 安装器版权行」三件易回归的事钉在发版入口，
      # 免得出版本才发现 pin 被 action 覆盖、crt-static 被删、或 LegalCopyright 退回 TODO。
      - name: 元数据自检（工具链 pin / 静态 CRT / LegalCopyright）
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          echo "== rust-toolchain.toml =="
          if [ ! -f rust-toolchain.toml ]; then
            echo "::error::缺少 rust-toolchain.toml：工具链无 pin，见 docs/dev/ci.md §5。"; fail=1
          elif ! grep -Eq '^channel[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+"' rust-toolchain.toml; then
            echo "::error::rust-toolchain.toml 没有合法的 channel（形如 channel = \"1.95\"）。"; fail=1
          else
            grep -E '^channel' rust-toolchain.toml
          fi
          # release 由 tag 触发，不经过 ci.yml 的 meta job，所以这里单独断言一次
          # 「本文件里 action 的 toolchain 输入 == toml 的 channel」（防发版时 pin 漂了）。
          # `|| true`：toml 缺失或 sed|head 的 SIGPIPE 不应让 set -e 以晦涩方式中止，
          # 下面用空值分支给出明确报错。
          pin_channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1 || true)"
          pin_vals="$(sed -nE 's/^[[:space:]]*toolchain:[[:space:]]*"([^"]+)".*/\1/p' .github/workflows/release.yml || true)"
          if [ -z "$pin_channel" ]; then
            echo "::error::解析不到 rust-toolchain.toml 的 channel（形如 channel = 1.95 的带引号写法）。"; fail=1
          fi
          if [ -z "$pin_vals" ]; then
            echo "::error::release.yml 的 Rust action 没有显式传 toolchain 输入：@stable 会先装一份 stable，再由 rustup 补装 toml 的版本。"; fail=1
          else
            while IFS= read -r pv; do
              [ -z "$pv" ] && continue
              if [ "$pv" != "$pin_channel" ]; then
                echo "::error::release.yml 的 toolchain 输入=$pv 与 rust-toolchain.toml 的 channel=$pin_channel 不一致。"; fail=1
              fi
            done <<< "$pin_vals"
          fi
          echo "== .cargo/config.toml（静态 CRT）=="
          if [ ! -f .cargo/config.toml ]; then
            echo "::error::缺少 .cargo/config.toml：静态 CRT（D13-A / 验收 #15a）会失效。"; fail=1
          elif ! grep -q 'crt-static' .cargo/config.toml; then
            echo "::error::.cargo/config.toml 里没有 crt-static（验收 #15a 必失败）。"; fail=1
          else
            echo "OK：crt-static 已配置"
          fi
          echo "== installer/ariahost.nsi 版权行 =="
          if [ ! -f installer/ariahost.nsi ]; then
            echo "::error::缺少 installer/ariahost.nsi。"; fail=1
          elif grep -qi 'LegalCopyright.*TODO' installer/ariahost.nsi; then
            echo "::error::installer/ariahost.nsi 的 LegalCopyright 仍是 TODO 占位。"; fail=1
          else
            grep -i 'LegalCopyright' installer/ariahost.nsi
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "元数据自检通过。"

  build:
    name: 构建 x64 per-user
    needs: version
    runs-on: windows-latest
    # 首版压到 30 分钟（挂住时最坏计费 60 分钟，而不是 120）；首次跑若不够再按日志基线调大。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 确认 workspace 存在
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.toml)) {
            Write-Error "仓库尚无 Cargo.toml：发布流水线待 M1 落地后才有意义。"
            exit 1
          }
      # 必须显式传 toolchain：该 action 的 toolchain 输入默认是 stable，不传会先装 stable、
      # 再由 rustup 按 rust-toolchain.toml 补装第二份（tag 发布这条路也一样付这份钱）。
      # 值必须与 rust-toolchain.toml 的 channel 一致 —— version job 的元数据自检会断言。
      - name: 安装 Rust（显式传 toolchain 输入，版本与 rust-toolchain.toml 一致）
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      # 同 ci.yml：build.rs 里的 winresource 需要 Windows SDK 的 rc.exe（它按 RC_PATH →
      # WindowsSdkVerBinPath → 注册表 KitsRoot10 查找，不依赖 PATH），这一步导入 VS x64 开发环境兜底。
      - name: 导入 MSVC 开发环境（rc.exe，供 build.rs 的 winresource 使用）
        uses: ilammy/msvc-dev-cmd@v1
      - name: 校验工具链 pin 生效（rustc 1.95.x）
        shell: bash
        run: |
          set -euo pipefail
          rustc -V
          case "$(rustc -V)" in
            "rustc 1.95."*) echo "OK：rustc 与 rust-toolchain.toml 一致" ;;
            *) echo "::error::rustc 版本与 rust-toolchain.toml 不符：$(rustc -V)。"; exit 1 ;;
          esac
      - name: 缓存 registry 与 target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-x64-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
          restore-keys: |
            ${{ runner.os }}-release-x64-
      - name: 构建（release, x64）
        run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: 暂存产物到 dist/x64
        shell: pwsh
        run: |
          $dist = "dist/x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = "target/x86_64-pc-windows-msvc/release/ariahost.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "缺少 $exe：请确认某个 crate 声明了 [[bin]] name = `"ariahost`"。"
            exit 1
          }
          Copy-Item $exe (Join-Path $dist "ariahost.exe") -Force
          # 图标一并进 SRCDIR：installer\ariahost.nsi 的 MUI_ICON / Icon / File 都按
          # "${SRCDIR}\ariahost.ico" 取文件，缺了 makensis 会报 "no files found"。
          Copy-Item "installer/ariahost.ico" (Join-Path $dist "ariahost.ico") -Force
          if (-not (Test-Path (Join-Path $dist "ariahost.ico"))) { Write-Error "图标暂存失败（installer/ariahost.ico 缺失）"; exit 1 }
          Get-ChildItem $dist | Select-Object Name, Length
      # 内置 aria2 核心（task-54 A 条，P0）：真实用户网络下「首次运行在线下载」不可用
      # （双线路实测均失败，见 docs/dev/known-limitations.md L6），所以核心必须随包分发。
      #
      # 三条硬纪律：
      # 1) **哈希钉死**：只认这一个 SHA-256，任何偏差立即失败。这是供应链闸门，
      #    不是提示；值同时被 crates/ariahost-core/src/fetch.rs 的 KNOWN_SHA256
      #    用于装配内下载通道，两处必须一致（2026-11-25 独立复算确认一致）。
      # 2) **原样分发**：zip 解出的 aria2c.exe 逐字节拷进 dist，不重命名以外的任何加工。
      # 3) **许可同进同退**：GPLv2 二进制分发义务要求随附许可与来源说明；COPYING 等
      #    取官方包内原文，NOTICE 取仓库内人工撰写版（可 review、可 diff）。
      - name: 内置 aria2c 核心（下载 + SHA-256 硬校验 + 许可随附）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver    = '1.37.0'
          $zipName = "aria2-$ver-win-64bit-build1.zip"
          $url    = "https://github.com/aria2/aria2/releases/download/release-$ver/$zipName"
          # 唯一认可的哈希（zip 整体）。改动此值必须先解释来源，见 docs/dev/release.md §7。
          $sha256 = '67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288'
          $dist   = 'dist/x64'
          $work   = Join-Path $env:RUNNER_TEMP 'aria2-bundle'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work $zipName

          # GitHub 443 在本项目历史上不稳定（见 docs/dev/build.md）；不给重试就会偶发红。
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 120
              if ((Get-Item $zip).Length -gt 1000000) { break }
            } catch {
              Write-Host "下载第 $attempt 次失败：$($_.Exception.Message)"
            }
            if ($attempt -eq 3) { Write-Error "下载 aria2 失败 3 次：$url"; exit 1 }
            Start-Sleep -Seconds (5 * $attempt)
          }

          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          Write-Host "aria2 zip SHA-256 = $actual"
          if ($actual -ne $sha256) {
            Write-Error "aria2 哈希不匹配：期望 $sha256，实际 $actual。拒绝继续打包（供应链闸门）。"
            exit 1
          }

          Expand-Archive -Path $zip -DestinationPath $work -Force
          $core = @(Get-ChildItem -Path $work -Recurse -Filter 'aria2c.exe' -File)
          if ($core.Count -ne 1) {
            Write-Error "官方包内应恰有 1 个 aria2c.exe，实际 $($core.Count) 个；包结构变化需人工复核"
            exit 1
          }
          Copy-Item $core[0].FullName (Join-Path $dist 'aria2c.exe') -Force
          $coreHash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $dist 'aria2c.exe')).Hash.ToLowerInvariant()
          Write-Host "随包 aria2c.exe SHA-256 = $coreHash（与安装目录内的同名文件应逐字节一致）"

          # 许可文本与来源说明**不在这一步生成**：它们以仓库内受 review 的文件为唯一来源
          # （installer/licenses/aria2-COPYING.txt 取自官方包内 COPYING 原文，18092 B；
          #   THIRD-PARTY-NOTICES.md 为人工撰写、可 diff）。这里只做「两个文件都在」的存在性
          # 检查 + 与官方包内 COPYING 的逐字节对账，防止有人改了仓库内那份却没人发现。
          $repoCopying = 'installer/licenses/aria2-COPYING.txt'
          $notice      = 'THIRD-PARTY-NOTICES.md'
          foreach ($f in @($repoCopying, $notice)) {
            if (-not (Test-Path $f)) { Write-Error "GPLv2 分发义务文件缺失：$f"; exit 1 }
          }
          $official = @(Get-ChildItem -Path $work -Recurse -Filter 'COPYING' -File | Select-Object -First 1)
          if ($official.Count -eq 0) { Write-Error "官方包内没有 COPYING：无法对账许可原文"; exit 1 }
          $a = (Get-FileHash -Algorithm SHA256 -Path $official[0].FullName).Hash
          $b = (Get-FileHash -Algorithm SHA256 -Path $repoCopying).Hash
          if ($a -ne $b) {
            $sb = (Get-Item $repoCopying).Length
            $sa = (Get-Item $official[0].FullName).Length
            Write-Host "::error::许可原文对账失败：repo=$b ($sb B) / official=$a ($sa B)"
            if ($sa -ne $sb) {
              Write-Host "::error::两侧字节数差 $([Math]::Abs($sa - $sb)) B。若该差值等于行数，几乎肯定是**换行符**被 checkout 改写成了 CRLF（git 的 autocrlf/text 规则），而不是有人改了许可正文——先查 .gitattributes 是否对 installer/licenses/ 声明了 `-text`。"
            }
            exit 1
          }
          Write-Host "许可原文对账通过：COPYING SHA-256 = $b"
          Get-ChildItem $dist | Select-Object Name, Length
      # 顺序约束（docs/dev/release.md §5）：**先签 exe → 再 makensis 打包 → 再签 setup**。
      # 打包之后再签 exe 已经晚了（setup 里嵌的 payload 仍是未签名的），所以这一步必须在这里。
      - name: 代码签名 exe（占位：Q8 首版不签，无 secret 时跳过）
        if: env.SIGN_CERT != ''
        shell: pwsh
        env:
          SIGN_PASS: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          Write-Host "SIGN_CERT 已配置：此处应执行 signtool sign /f cert.pfx /p <pass> dist/x64/ariahost.exe"
          Write-Host "::warning::exe 签名是占位实现，产物未签名（TODO: 接入 signtool）。"
      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $nsis = $cmd.Source }
          }
          if (-not $nsis) { Write-Error "makensis 未找到（choco 安装失败？）"; exit 1 }
          "MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 不用 `makensis /VERSION` 探版本：该开关不在 Chapter 3 §3.1.1 的选项清单里
          # （清单有 /HDRINFO、/V、/LICENSE 等），若不存在这一步会在整条构建之后才红。
          # 读文件版本信息只要求文件存在，零风险。
          $vi = (Get-Item $nsis).VersionInfo
          Write-Host "makensis = $nsis（FileVersion $($vi.FileVersion) / ProductVersion $($vi.ProductVersion)）"
      - name: 编译安装包（makensis，x64 per-user）
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VI_VERSION: ${{ needs.version.outputs.vi_version }}
        run: |
          # 输出与源目录都显式给绝对路径（/DOUTFILE、/DSRCDIR 覆盖 .nsi 默认值），
          # 不依赖 makensis 的「相对脚本目录」工作目录假设。
          $out = Join-Path $PWD "installer/AriaHost-$env:VERSION-x64-setup.exe"
          $src = Join-Path $PWD "dist/x64"
          Remove-Item $out -ErrorAction SilentlyContinue
          # /INPUTCHARSET UTF8：installer/ariahost.nsi 是 UTF-8（无 BOM），含大量中文字面量
          # （MUI 文案 / VersionKey）。不显式声明输入字符集时，en-US runner 的 ANSI 代码页会
          # 把中文读成乱码（首次编译最容易在这里红）。也同样适用于 .nsh 头文件。
          # /DNO_BUNDLED_ARIA2 不传：**默认就是「必须带核心」**（task-54 B3 起，
          # ariahost.nsi 里缺 ${SRCDIR}\aria2c.exe 直接 !error 编译失败）。所以这里
          # 不需要额外的 /DBUNDLED_ARIA2_REQUIRED——少一个"发布时要记得传的 define"，
          # 也就少一种「忘了传 → 悄悄出无核心包」的事故形态。
          & $env:MAKENSIS /V2 /INPUTCHARSET UTF8 "/DVERSION=$env:VERSION" "/DVI_VERSION=$env:VI_VERSION" "/DARCH=x64" "/DSRCDIR=$src" "/DOUTFILE=$out" "installer\ariahost.nsi"
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis 失败（exit $LASTEXITCODE）"; exit $LASTEXITCODE }
          if (-not (Test-Path $out)) { Write-Error "未生成 $out"; exit 1 }
          Copy-Item $out "dist/x64/" -Force
          Get-Item $out | Select-Object Name, Length
      - name: 代码签名 setup（占位：Q8 首版不签，无 secret 时跳过）
        # 位置要求：在 makensis 之后、生成 SHA256SUMS 之前（校验和必须算在最终产物上，见下一 step 注释）。
        if: env.SIGN_CERT != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGN_PASS: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          # 启用方式：在仓库 secrets 配 SIGN_CERT_PFX_BASE64 / SIGN_CERT_PASSWORD，
          # 并把两处签名占位（本步骤 + 打包前的 exe 那一步）换成真实的 signtool 调用。
          Write-Host "SIGN_CERT 已配置，但签名步骤仍是占位实现（TODO: 接入 signtool）。"
          Write-Host "::warning::签名占位步骤未执行实际签名，产物未签名。"
      # SHA256SUMS 只覆盖 x64 per-user 包 + exe，且文件名里带 -x64- 段。
      # M4 加变体时注意：per-user 是 AriaHost-<ver>-x64-setup.exe，全机变体是
      # AriaHost-<ver>-x64-machine-setup.exe。若把下面的 glob 改成 -setup.exe 通配，
      # 同一发布会一次捞出两个包 → 校验和与 Release 附件重名/互相覆盖。
      #
      # 顺序约束（不可调换）：**任何签名步骤都必须在本步骤之前**。签名会改字节，
      # 先算校验和再签名 → 用户按 SHA-256 核对必然失败（docs/dev/release.md §5）。
      - name: 生成 SHA256SUMS 与版本清单
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $dir = "dist/x64"
          $setup = Get-Item -Path "$dir/AriaHost-$env:VERSION-x64-setup.exe" -ErrorAction Stop
          if ($setup.Name -match 'machine') { Write-Error "glob 命中了全机变体包，首版不应出现：$($setup.Name)"; exit 1 }
          $files = @($setup, (Get-Item "$dir/ariahost.exe"))
          $lines = foreach ($f in $files) {
            "$((Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii "$dir/SHA256SUMS.txt"
          $manifest = [ordered]@{
            product   = "AriaHost"
            version   = $env:VERSION
            arch      = "x64"
            target    = "x86_64-pc-windows-msvc"
            variant   = "per-user"
            commit    = "${{ github.sha }}"
            built_at  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            files     = $lines
            notes     = "未经本地代码签名（Q8 首版口径）"
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$dir/AriaHost-$env:VERSION-x64-manifest.json"
          Get-Content "$dir/SHA256SUMS.txt"
      - name: 上传 artifact（7 天）
        uses: actions/upload-artifact@v4
        with:
          name: AriaHost-${{ needs.version.outputs.version }}-x64
          path: dist/x64/
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 【M4 恢复】x86（i686-pc-windows-msvc）构建 —— 首版不启用，整段注释掉
  #
  # 为什么不留 continue-on-error：私有仓 Windows runner 按 2× 分钟计费，
  # 失败 job 一样烧分钟；而且失败被静默吞掉后，没人会注意到 x86 其实一直没出包，
  # 这比「不跑」更坏（Q3/Q15 已定：x86 在 M4 转正为必成）。
  #
  # M4 恢复步骤（四处一起改，漏一处就 pin 失效/缓存错乱）：
  #   1. 解开下面整段 job，并把 publish 的 needs 改成 [version, build, build-x86]；
  #   2. rust-toolchain.toml 的 targets 加上 "i686-pc-windows-msvc"；
  #   3. .cargo/config.toml 取消 [target.i686-pc-windows-msvc] 段注释；
  #   4. publish 的产物 glob 说明同步补 -x86 / -machine- 变体（见 build job 里的注释）。
  #
  # build-x86:
  #   name: 构建 x86（M4 启用）
  #   needs: version
  #   runs-on: windows-latest
  #   timeout-minutes: 60
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: 安装 Rust（显式传 toolchain 输入，版本与 rust-toolchain.toml 一致）
  #       id: toolchain
  #       uses: dtolnay/rust-toolchain@stable
  #       with:
  #         toolchain: "1.95"
  #     - name: 缓存 registry 与 target
  #       uses: actions/cache@v4
  #       with:
  #         path: |
  #           ~/.cargo/registry/index
  #           ~/.cargo/registry/cache
  #           ~/.cargo/git/db
  #           target
  #         key: ${{ runner.os }}-release-x86-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
  #     - name: 构建（release, x86）
  #       run: cargo build --workspace --release --locked --target i686-pc-windows-msvc
  #     - name: 打包（makensis，x86）
  #       shell: pwsh
  #       run: |
  #         # 与 x64 job 同构，只把 /DARCH 与目录换成 x86
  #         # 注意：i686 目前仅在 .cargo/config.toml 里注释保留 crt-static，恢复时必须一并解开
  #         Write-Error "M4 恢复时补全本步骤（参考 build job 的 makensis 调用）"
  # ───────────────────────────────────────────────────────────────────────────

  publish:
    name: 发布 GitHub Release
    needs: [version, build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载 artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: 汇总安装包与校验和
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          # 只捞 x64 per-user 包：文件名形如 AriaHost-<ver>-x64-setup.exe。
          # 全机变体是 AriaHost-<ver>-x64-machine-setup.exe，不会被 '*-x64-setup.exe' 命中；
          # 若改成 '*-setup.exe'，M4 之后会一次捞到多个包并互相覆盖。
          find release-assets -type f -name '*-x64-setup.exe' -exec cp {} out/ \;
          find release-assets -type f -name '*-manifest.json' -exec cp {} out/ \;
          ls -l out
          # 硬门禁：x64 per-user 是首版唯一产物，缺了就不发 Release
          if [ ! -f "out/AriaHost-${VERSION}-x64-setup.exe" ]; then
            echo "::error::缺少 x64 安装包 AriaHost-${VERSION}-x64-setup.exe，构建未产出，本次不发布。"
            exit 1
          fi
          cd out
          sha256sum ./*.exe | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 生成 release notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "AriaHost ${VERSION}"
            echo
            echo "本次产物（首版只发 x64 per-user 单包）："
            echo
            echo "- x64 安装包：\`AriaHost-${VERSION}-x64-setup.exe\`"
            echo "- 校验和：\`SHA256SUMS.txt\`（下载后务必核对）"
            echo "- 版本清单：\`AriaHost-${VERSION}-x64-manifest.json\`"
            echo
            echo "安装包未做代码签名（首版口径），SmartScreen 可能提示「未知发布者」，"
            echo "请以 SHA-256 校验值为准。"
            echo
            echo "## 变更"
            echo
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "${prev}" ]; then
              git log --pretty=format:'- %s (%h)' "${prev}..HEAD"
            else
              git log --pretty=format:'- %s (%h)' -20 HEAD
            fi
            echo
          } > notes.md
          cat notes.md
      - name: 创建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(out/*.exe out/SHA256SUMS.txt out/*manifest.json)
          echo "上传 ${#assets[@]} 个文件"
          gh release create "$TAG" --title "AriaHost $VERSION" --notes-file notes.md --verify-tag "${assets[@]}"
