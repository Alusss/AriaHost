# AriaHost — 发布流水线（x64 + x86 双 per-user 包 + NSIS 安装包）
#
# 触发：推送 v* tag（会创建 GitHub Release）或手动 workflow_dispatch（只出 artifact）。
#
# 计费前提：private 仓库，Windows runner 2× 分钟计费（Free 2000 分钟/月 ≈ 1000 分钟实际构建）。
# 矩阵两条腿（x64 / x86）都真跑：clippy + test + release build + **各自独立的 dumpbin
# 静态 CRT 门禁**。x86 是交叉编译（host x64 / target i686，rc.exe 走 Hostx64\x86），
# 首次跑靠 matrix.timeout 留余量。双架构定版见 Q17 / 架构 §4.9.1。
#
# 现状（2026-11-26）：Rust 工程与 Cargo.toml 已在；`installer/ariahost.nsi` 已由 CI 的
# 真实 makensis 编译通过并出过 v0.1.0 / v0.1.1 / v0.1.2 三个 Release。详见
# docs/dev/ci.md 与 docs/dev/release.md。
#
# 为什么这里没有 paths 过滤：tag 推送本身就是一次显式的发布决定，用路径过滤跳过它只会在
# 「忘了改某文件」时造成「打了 tag 却没有 Release」这种更难查的故障。省分钟靠的是
# 「双架构必须都在 tag 上验过 + 7 天 artifact 保留」，不是跳过发布。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v 前缀，如 0.1.0；留空则从 tag 或 Cargo.toml 读取）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Q8 已定首版不签名；配置该 secret 后签名步骤才会出现，见 docs/dev/release.md。
  SIGN_CERT: ${{ secrets.SIGN_CERT_PFX_BASE64 }}

jobs:
  version:
    name: 解析版本 + 元数据自检
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      vi_version: ${{ steps.ver.outputs.vi_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 解析版本号（dispatch input > v* tag > workspace Cargo.toml）
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-}"
          if [ -z "$v" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$v" ] && [ -f Cargo.toml ]; then
            v="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/^[^"]*"([^"]+)".*/\1/' || true)"
          fi
          if [ -z "$v" ]; then
            echo "::error::无法解析版本号：请传 dispatch input、打 v* tag，或在根 Cargo.toml 写 [workspace.package] version。"
            exit 1
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::版本号不是 semver 形式（不带 v 前缀）：$v"
            exit 1
          fi
          # 版本一致性（审计 F8）：本次发布号 vs Cargo.toml 的 [workspace.package] version。
          # 不一致就 exit 1 —— 否则会发出「tag 写 0.1.0、二进制里是 0.2.0」名实不符的包。
          # Cargo.toml 尚未落地时跳过（M1 之前本 job 只做解析，见 ci.md）。
          if [ -f Cargo.toml ]; then
            crate_v="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/^[^"]*"([^"]+)".*/\1/' || true)"
            if [ -z "$crate_v" ]; then
              echo "::error::Cargo.toml 里解析不到 version（[workspace.package] version = x.y.z 的带引号写法）。"
              exit 1
            fi
            if [ "$crate_v" != "$v" ]; then
              echo "::error::版本不一致：本次发布 $v，Cargo.toml 是 $crate_v。改齐再发。"
              exit 1
            fi
            echo "OK：Cargo.toml 版本与本次发布一致（$v）"
          else
            echo "::warning::仓库尚无 Cargo.toml：跳过版本一致性校验（M1 前预期）。"
          fi
          # NSIS 的 VIProductVersion 必须是四段数字，pre-release 后缀在此被截断
          vi="$(sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3.0/' <<< "$v")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "vi_version=$vi" >> "$GITHUB_OUTPUT"
          echo "::notice::version=$v vi_version=$vi"
      # 便宜的常驻自检：把「工具链 pin / 静态 CRT / 安装器版权行」三件易回归的事钉在发版入口，
      # 免得出版本才发现 pin 被 action 覆盖、crt-static 被删、或 LegalCopyright 退回 TODO。
      - name: 元数据自检（工具链 pin / 静态 CRT / LegalCopyright）
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          echo "== rust-toolchain.toml =="
          if [ ! -f rust-toolchain.toml ]; then
            echo "::error::缺少 rust-toolchain.toml：工具链无 pin，见 docs/dev/ci.md §5。"; fail=1
          elif ! grep -Eq '^channel[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+"' rust-toolchain.toml; then
            echo "::error::rust-toolchain.toml 没有合法的 channel（形如 channel = \"1.95\"）。"; fail=1
          else
            grep -E '^channel' rust-toolchain.toml
          fi
          # release 由 tag 触发，不经过 ci.yml 的 meta job，所以这里单独断言一次
          # 「本文件里 action 的 toolchain 输入 == toml 的 channel」（防发版时 pin 漂了）。
          # `|| true`：toml 缺失或 sed|head 的 SIGPIPE 不应让 set -e 以晦涩方式中止，
          # 下面用空值分支给出明确报错。
          pin_channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1 || true)"
          pin_vals="$(sed -nE 's/^[[:space:]]*toolchain:[[:space:]]*"([^"]+)".*/\1/p' .github/workflows/release.yml || true)"
          if [ -z "$pin_channel" ]; then
            echo "::error::解析不到 rust-toolchain.toml 的 channel（形如 channel = 1.95 的带引号写法）。"; fail=1
          fi
          if [ -z "$pin_vals" ]; then
            echo "::error::release.yml 的 Rust action 没有显式传 toolchain 输入：@stable 会先装一份 stable，再由 rustup 补装 toml 的版本。"; fail=1
          else
            while IFS= read -r pv; do
              [ -z "$pv" ] && continue
              if [ "$pv" != "$pin_channel" ]; then
                echo "::error::release.yml 的 toolchain 输入=$pv 与 rust-toolchain.toml 的 channel=$pin_channel 不一致。"; fail=1
              fi
            done <<< "$pin_vals"
          fi
          echo "== .cargo/config.toml（静态 CRT）=="
          if [ ! -f .cargo/config.toml ]; then
            echo "::error::缺少 .cargo/config.toml：静态 CRT（D13-A / 验收 #15a）会失效。"; fail=1
          elif ! grep -q 'crt-static' .cargo/config.toml; then
            echo "::error::.cargo/config.toml 里没有 crt-static（验收 #15a 必失败）。"; fail=1
          else
            echo "OK：crt-static 已配置"
          fi
          echo "== installer/ariahost.nsi 版权行 =="
          if [ ! -f installer/ariahost.nsi ]; then
            echo "::error::缺少 installer/ariahost.nsi。"; fail=1
          elif grep -qi 'LegalCopyright.*TODO' installer/ariahost.nsi; then
            echo "::error::installer/ariahost.nsi 的 LegalCopyright 仍是 TODO 占位。"; fail=1
          else
            grep -i 'LegalCopyright' installer/ariahost.nsi
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "元数据自检通过。"

  build:
    name: 构建 ${{ matrix.arch }} per-user
    needs: version
    runs-on: windows-latest
    # fail-fast: false —— 一条腿失败不许取消另一条腿：两个包都要有，且失败原因必须两条都能看到。
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两条腿唯一允许的差异就是这张表；所有步骤都只读 matrix.*，不再有硬编码的 arch/target。
          - arch: x64
            target: x86_64-pc-windows-msvc
            bits: 64
            abi: msvc
            min_windows: "10.0.17763"
            aria2_zip: aria2-1.37.0-win-64bit-build1.zip
            # 与 crates/ariahost-core/src/fetch.rs 的 KNOWN_SHA256 同源；改一处必须改两处。
            aria2_sha256: 67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288
            # 挂住时最坏计费 2×；首次跑若不够再按日志基线调大。
            timeout: 30
          - arch: x86
            target: i686-pc-windows-msvc
            bits: 32
            abi: msvc
            min_windows: "10.0.17763"
            aria2_zip: aria2-1.37.0-win-32bit-build1.zip
            aria2_sha256: 35f6514cc5dd7e98a87b3c4c2d25a0754b9b063dbe59bc0f22d483464f61e5b6
            # x86 是交叉编译（host x64、target i686 的 rc.exe 要走 Hostx64\x86），首次跑留足余量。
            timeout: 40
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - name: 确认 workspace 存在
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.toml)) {
            Write-Error "仓库尚无 Cargo.toml：发布流水线待 M1 落地后才有意义。"
            exit 1
          }
      # 必须显式传 toolchain：该 action 的 toolchain 输入默认是 stable，不传会先装 stable、
      # 再由 rustup 按 rust-toolchain.toml 补装第二份（tag 发布这条路也一样付这份钱）。
      # 值必须与 rust-toolchain.toml 的 channel 一致 —— version job 的元数据自检会断言。
      - name: 安装 Rust（显式传 toolchain 输入，版本与 rust-toolchain.toml 一致）
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          # 显式给 targets：交叉目标的 std 由本 action 装入。不传时只有宿主的默认 target，
          # `cargo build --target i686-pc-windows-msvc` 会报 "can't find crate for `std`"。
          # 值来自 matrix，与 rust-toolchain.toml 的 targets 列表必须一致（meta job 会查）。
          targets: ${{ matrix.target }}
      # 同 ci.yml：build.rs 里的 winresource 需要 Windows SDK 的 rc.exe（它按 RC_PATH →
      # WindowsSdkVerBinPath → 注册表 KitsRoot10 查找，不依赖 PATH），这一步导入 VS x64 开发环境兜底。
      - name: 导入 MSVC 开发环境（rc.exe，供 build.rs 的 winresource 使用）
        uses: ilammy/msvc-dev-cmd@v1
      - name: 校验工具链 pin 生效（rustc 1.95.x）
        shell: bash
        run: |
          set -euo pipefail
          rustc -V
          case "$(rustc -V)" in
            "rustc 1.95."*) echo "OK：rustc 与 rust-toolchain.toml 一致" ;;
            *) echo "::error::rustc 版本与 rust-toolchain.toml 不符：$(rustc -V)。"; exit 1 ;;
          esac
      - name: 缓存 registry 与 target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.arch }}-
      - name: 构建（release, ${{ matrix.arch }}）
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      # 静态 CRT 门禁（两个架构都跑）：发出去的 exe 绝不能依赖 VCRUNTIME140/MSVCP140，
      # 否则用户机器没装 VC++ 运行库就是「双击没反应」。CI 里 x64/x86 各有同名门禁，
      # 这里是发布路径上的最后一道（CI 的 32 位腿只在定时/手动跑，发布必跑）。
      - name: 静态 CRT 门禁（dumpbin，${{ matrix.arch }}）
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/ariahost.exe"
          if (-not (Test-Path $exe)) { Write-Error "缺少 $exe"; exit 1 }
          Get-Item $exe | Select-Object Name, Length
          $dumpbin = $null
          $cmd = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($cmd) { $dumpbin = $cmd.Source }
          if (-not $dumpbin) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              if ($vs) {
                $cand = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory |
                  Sort-Object Name -Descending |
                  ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\dumpbin.exe' } |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
                if ($cand) { $dumpbin = $cand }
              }
            }
          }
          if (-not $dumpbin) { Write-Error "找不到 dumpbin.exe：${{ matrix.arch }} 的静态 CRT 门禁无法执行（不降级为 warning）"; exit 1 }
          $deps = (& $dumpbin /nologo /dependents $exe) | Out-String
          Write-Host $deps
          $bad = @('VCRUNTIME140', 'VCRUNTIME140_1', 'MSVCP140') | Where-Object { $deps -match $_ }
          if ($bad.Count -gt 0) { Write-Error "${{ matrix.arch }} 产物动态链接了 VC++ 运行库（$($bad -join ',')）：静态 CRT 失效"; exit 1 }
          Write-Host "OK：${{ matrix.arch }} 产物只依赖系统 DLL（无 VCRUNTIME/MSVCP）"
      - name: 暂存产物到 dist/${{ matrix.arch }}
        shell: pwsh
        run: |
          $dist = "dist/${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = "target/${{ matrix.target }}/release/ariahost.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "缺少 $exe：请确认某个 crate 声明了 [[bin]] name = `"ariahost`"。"
            exit 1
          }
          Copy-Item $exe (Join-Path $dist "ariahost.exe") -Force
          # 图标一并进 SRCDIR：installer\ariahost.nsi 的 MUI_ICON / Icon / File 都按
          # "${SRCDIR}\ariahost.ico" 取文件，缺了 makensis 会报 "no files found"。
          Copy-Item "installer/ariahost.ico" (Join-Path $dist "ariahost.ico") -Force
          if (-not (Test-Path (Join-Path $dist "ariahost.ico"))) { Write-Error "图标暂存失败（installer/ariahost.ico 缺失）"; exit 1 }
          Get-ChildItem $dist | Select-Object Name, Length
      # 内置 aria2 核心（task-54 A 条，P0）：真实用户网络下「首次运行在线下载」不可用
      # （双线路实测均失败，见 docs/dev/known-limitations.md L6），所以核心必须随包分发。
      #
      # 三条硬纪律：
      # 1) **哈希钉死**：只认这一个 SHA-256，任何偏差立即失败。这是供应链闸门，
      #    不是提示；值同时被 crates/ariahost-core/src/fetch.rs 的 KNOWN_SHA256
      #    用于装配内下载通道，两处必须一致（2026-11-25 独立复算确认一致）。
      # 2) **原样分发**：zip 解出的 aria2c.exe 逐字节拷进 dist，不重命名以外的任何加工。
      # 3) **许可同进同退**：GPLv2 二进制分发义务要求随附许可与来源说明；COPYING 等
      #    取官方包内原文，NOTICE 取仓库内人工撰写版（可 review、可 diff）。
      - name: 内置 aria2c 核心（下载 + SHA-256 硬校验 + 许可随附）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver    = '1.37.0'
          # 32/64 位的 zip 名与哈希都来自 matrix（唯一差异表），本脚本不再硬编码任何一位。
          $zipName = '${{ matrix.aria2_zip }}'
          $url    = "https://github.com/aria2/aria2/releases/download/release-$ver/$zipName"
          # 唯一认可的哈希（zip 整体）。改动此值必须先解释来源，见 docs/dev/release.md §7。
          # 与 crates/ariahost-core/src/fetch.rs 的 KNOWN_SHA256 同源，改一处必须改两处。
          $sha256 = '${{ matrix.aria2_sha256 }}'
          $dist   = 'dist/${{ matrix.arch }}'
          $work   = Join-Path $env:RUNNER_TEMP 'aria2-bundle'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work $zipName

          # GitHub 443 在本项目历史上不稳定（见 docs/dev/build.md）；不给重试就会偶发红。
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 120
              if ((Get-Item $zip).Length -gt 1000000) { break }
            } catch {
              Write-Host "下载第 $attempt 次失败：$($_.Exception.Message)"
            }
            if ($attempt -eq 3) { Write-Error "下载 aria2 失败 3 次：$url"; exit 1 }
            Start-Sleep -Seconds (5 * $attempt)
          }

          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          Write-Host "aria2 zip SHA-256 = $actual"
          if ($actual -ne $sha256) {
            Write-Error "aria2 哈希不匹配：期望 $sha256，实际 $actual。拒绝继续打包（供应链闸门）。"
            exit 1
          }

          Expand-Archive -Path $zip -DestinationPath $work -Force
          $core = @(Get-ChildItem -Path $work -Recurse -Filter 'aria2c.exe' -File)
          if ($core.Count -ne 1) {
            Write-Error "官方包内应恰有 1 个 aria2c.exe，实际 $($core.Count) 个；包结构变化需人工复核"
            exit 1
          }
          Copy-Item $core[0].FullName (Join-Path $dist 'aria2c.exe') -Force
          $coreHash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $dist 'aria2c.exe')).Hash.ToLowerInvariant()
          Write-Host "随包 aria2c.exe SHA-256 = $coreHash（与安装目录内的同名文件应逐字节一致）"

          # 许可文本与来源说明**不在这一步生成**：它们以仓库内受 review 的文件为唯一来源
          # （installer/licenses/aria2-COPYING.txt 取自官方包内 COPYING 原文，18092 B；
          #   THIRD-PARTY-NOTICES.md 为人工撰写、可 diff）。这里只做「两个文件都在」的存在性
          # 检查 + 与官方包内 COPYING 的逐字节对账，防止有人改了仓库内那份却没人发现。
          $repoCopying = 'installer/licenses/aria2-COPYING.txt'
          $notice      = 'THIRD-PARTY-NOTICES.md'
          foreach ($f in @($repoCopying, $notice)) {
            if (-not (Test-Path $f)) { Write-Error "GPLv2 分发义务文件缺失：$f"; exit 1 }
          }
          $official = @(Get-ChildItem -Path $work -Recurse -Filter 'COPYING' -File | Select-Object -First 1)
          if ($official.Count -eq 0) { Write-Error "官方包内没有 COPYING：无法对账许可原文"; exit 1 }
          $a = (Get-FileHash -Algorithm SHA256 -Path $official[0].FullName).Hash
          $b = (Get-FileHash -Algorithm SHA256 -Path $repoCopying).Hash
          if ($a -ne $b) {
            $sb = (Get-Item $repoCopying).Length
            $sa = (Get-Item $official[0].FullName).Length
            Write-Host "::error::许可原文对账失败：repo=$b ($sb B) / official=$a ($sa B)"
            if ($sa -ne $sb) {
              Write-Host "::error::两侧字节数差 $([Math]::Abs($sa - $sb)) B。若该差值等于行数，几乎肯定是**换行符**被 checkout 改写成了 CRLF（git 的 autocrlf/text 规则），而不是有人改了许可正文——先查 .gitattributes 是否对 installer/licenses/ 声明了 `-text`。"
            }
            exit 1
          }
          Write-Host "许可原文对账通过：COPYING SHA-256 = $b"
          Get-ChildItem $dist | Select-Object Name, Length
      # 顺序约束（docs/dev/release.md §5）：**先签 exe → 再 makensis 打包 → 再签 setup**。
      # 打包之后再签 exe 已经晚了（setup 里嵌的 payload 仍是未签名的），所以这一步必须在这里。
      - name: 代码签名 exe（占位：Q8 首版不签，无 secret 时跳过）
        if: env.SIGN_CERT != ''
        shell: pwsh
        env:
          SIGN_PASS: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          Write-Host "SIGN_CERT 已配置：此处应执行 signtool sign /f cert.pfx /p <pass> dist/${{ matrix.arch }}/ariahost.exe"
          Write-Host "::warning::exe 签名是占位实现，产物未签名（TODO: 接入 signtool）。"
      # NSIS 获取策略（task-79）：**缓存优先 → choco 钉版本重试 → 版本漂移断言**。
      # 为什么不再「进来就 choco 装一次」：2026-11-26 发 v0.1.3 时
      # community.chocolatey.org 抖 503，x64/x86 两条腿同时红，且红点都在整条
      # Windows 编译之后——私有仓分钟数按 2 倍计费，上游抖一次就烧两轮全量编译。
      # 缓存命中时零网络；两条腿共用一个键（冷缓存时并行会各装一次，第二次起都命中）。
      - name: 缓存 NSIS（版本钉 3.13.0）
        id: nsis-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-3.13.0-${{ runner.os }}
      - name: 安装 NSIS（缓存未命中：SourceForge 便携包优先，choco 仅兜底）
        shell: pwsh
        run: |
          if ("${{ steps.nsis-cache.outputs.cache-hit }}" -eq "true") {
            Write-Host "NSIS 命中缓存（key=nsis-3.13.0-${{ runner.os }}），跳过安装"
            exit 0
          }
          $dest = "${env:ProgramFiles(x86)}\NSIS"
          # 线路 1（首选）：SourceForge 便携 zip，钉 SHA-256。理由：2026-11-26 发 v0.1.3 时
          # chocolatey.org 先 503 后 504，x64/x86 两条腿同时红，且红点都在整条编译之后。
          # SourceForge 与 chocolatey.org 不在同一条依赖链上，且这份 zip 就是 NSIS 官方
          # 发布渠道（同版本同字节，本机实测用它能编译本项目 .nsi）。
          # 布局注意：zip 里真正的 makensis 在 `Bin\` 下。**不要**把它挪到安装根——实测挪
          # 到根会以 0xC0000135（STATUS_DLL_NOT_FOUND）退出；根的 2.5 KB `makensis.exe`
          # 是官方转发器，`/VERSION` 也正常回 v3.13。
          $url  = "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
          $want = "BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8"
          $zip  = Join-Path $env:RUNNER_TEMP "nsis-3.13.zip"
          $ok = $false
          for ($i = 0; $i -lt 2; $i++) {
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            curl.exe -L --retry 3 --retry-connrefused --max-time 180 -sS -o $zip $url
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "便携包下载失败（curl exit $LASTEXITCODE），第 $($i + 1)/2 次"
              Start-Sleep -Seconds 5
              continue
            }
            $got = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash
            if ($got -ne $want) {
              Write-Warning "便携包 SHA-256 不匹配：期望 $want，实际 $got（第 $($i + 1)/2 次）"
              Start-Sleep -Seconds 5
              continue
            }
            $ok = $true
            break
          }
          if ($ok) {
            $tmp = Join-Path $env:RUNNER_TEMP "nsis-x"
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $tmp -Force
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item (Join-Path $tmp "nsis-3.13\*") $dest -Recurse -Force
            if (Test-Path (Join-Path $dest "Bin\makensis.exe")) {
              Write-Host "NSIS 就绪（SourceForge 便携包，SHA-256 已核对；makensis 在 Bin\ 下）"
              exit 0
            }
            Write-Warning "便携包解包后没有 Bin\makensis.exe，转 choco 兜底"
          }
          # 线路 2（兜底）：choco 钉版本 + 3 次重试。
          # 退避阶梯按任务书钉成 10s / 30s / 60s。**只有「还有下一次」才退避**：
          # 3 次尝试只消耗前两档，第 3 次失败会立刻 fail-closed——若按 `$i -lt $waits.Count`
          # 判断，第 3 次失败后还要白等 60s 才退出（本地模拟实测到这一点，已修）。
          # 写成 $attempts-1 的好处：将来提到 4 次尝试，60s 档自动生效，不必改两处。
          $waits = @(10, 30, 60)
          $attempts = 3
          for ($i = 0; $i -lt $attempts; $i++) {
            Write-Host "::group::choco install nsis --version=3.13.0（第 $($i + 1)/$attempts 次）"
            choco install nsis --version=3.13.0 --no-progress -y
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { Write-Host "choco 安装成功（第 $($i + 1) 次）"; exit 0 }
            Write-Warning "第 $($i + 1) 次失败（exit $code）"
            if ($i -lt ($attempts - 1)) {
              Write-Host "等待 $($waits[$i]) s 后重试（503 多为上游瞬时抖动，退避一次往往就好）"
              Start-Sleep -Seconds $waits[$i]
            }
          }
          Write-Error "两条线路全失败：SourceForge 便携包不可用，choco 3 次也失败。没有 makensis 就出不了安装包，本步 fail-closed"
          exit 1
      - name: 解析 NSIS 并断言版本（3.13.x）
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\Bin\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $nsis = $cmd.Source }
          }
          if (-not $nsis) { Write-Error "makensis 未找到（便携包与 choco 两条线路都失败？）"; exit 1 }
          # 版本断言以 `/VERSION` 的运行时输出为准：便携包的 `Bin\makensis.exe` **没有**
          # 版本资源（实测 FileVersion 为空），只读文件版本会在这里假红。FileVersion 仅兜底。
          $probe = (& $nsis /VERSION 2>&1 | Out-String).Trim()
          $vi = (Get-Item $nsis).VersionInfo
          $probeOk = ($probe -match '3\.13')
          $fileOk = ($vi.FileVersion -and $vi.FileVersion.StartsWith("3.13"))
          if (-not ($probeOk -or $fileOk)) {
            Write-Error "makensis 版本漂移：期望 3.13.x，/VERSION='$probe'，FileVersion='$($vi.FileVersion)'（路径 $nsis）"
            exit 1
          }
          "MAKENSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MAKENSIS=$nsis（/VERSION='$probe' / FileVersion='$($vi.FileVersion)' / ProductVersion='$($vi.ProductVersion)'）"
      - name: 编译安装包（makensis，${{ matrix.arch }} per-user）
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VI_VERSION: ${{ needs.version.outputs.vi_version }}
        run: |
          # 输出与源目录都显式给绝对路径（/DOUTFILE、/DSRCDIR 覆盖 .nsi 默认值），
          # 不依赖 makensis 的「相对脚本目录」工作目录假设。
          $out = Join-Path $PWD "installer/AriaHost-$env:VERSION-${{ matrix.arch }}-setup.exe"
          $src = Join-Path $PWD "dist/${{ matrix.arch }}"
          Remove-Item $out -ErrorAction SilentlyContinue
          # /INPUTCHARSET UTF8：installer/ariahost.nsi 是 UTF-8（无 BOM），含大量中文字面量
          # （MUI 文案 / VersionKey）。不显式声明输入字符集时，en-US runner 的 ANSI 代码页会
          # 把中文读成乱码（首次编译最容易在这里红）。也同样适用于 .nsh 头文件。
          # /DNO_BUNDLED_ARIA2 不传：**默认就是「必须带核心」**（task-54 B3 起，
          # ariahost.nsi 里缺 ${SRCDIR}\aria2c.exe 直接 !error 编译失败）。所以这里
          # 不需要额外的 /DBUNDLED_ARIA2_REQUIRED——少一个"发布时要记得传的 define"，
          # 也就少一种「忘了传 → 悄悄出无核心包」的事故形态。
          & $env:MAKENSIS /V2 /INPUTCHARSET UTF8 "/DVERSION=$env:VERSION" "/DVI_VERSION=$env:VI_VERSION" "/DARCH=${{ matrix.arch }}" "/DSRCDIR=$src" "/DOUTFILE=$out" "installer\ariahost.nsi"
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis 失败（exit $LASTEXITCODE）"; exit $LASTEXITCODE }
          if (-not (Test-Path $out)) { Write-Error "未生成 $out"; exit 1 }
          Copy-Item $out "dist/${{ matrix.arch }}/" -Force
          Get-Item $out | Select-Object Name, Length
      - name: 代码签名 setup（占位：Q8 首版不签，无 secret 时跳过）
        # 位置要求：在 makensis 之后、生成 SHA256SUMS 之前（校验和必须算在最终产物上，见下一 step 注释）。
        if: env.SIGN_CERT != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGN_PASS: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          # 启用方式：在仓库 secrets 配 SIGN_CERT_PFX_BASE64 / SIGN_CERT_PASSWORD，
          # 并把两处签名占位（本步骤 + 打包前的 exe 那一步）换成真实的 signtool 调用。
          Write-Host "SIGN_CERT 已配置，但签名步骤仍是占位实现（TODO: 接入 signtool）。"
          Write-Host "::warning::签名占位步骤未执行实际签名，产物未签名。"
      # SHA256SUMS 只覆盖**本腿那一份** per-user 包 + exe，文件名里带 -<arch>- 段。
      # M4-1 起两条腿并行，各自算各自的校验和（两个 artifact 互不覆盖：name 与 path 都按 matrix 区分）。
      # 注意：per-user 是 AriaHost-<ver>-<arch>-setup.exe，全机变体是
      # AriaHost-<ver>-<arch>-machine-setup.exe。若把下面的 glob 改成 -setup.exe 通配，
      # 会一次捞出两个包 → 校验和与 Release 附件重名/互相覆盖（本步已显式断言不含 machine）。
      #
      # 顺序约束（不可调换）：**任何签名步骤都必须在本步骤之前**。签名会改字节，
      # 先算校验和再签名 → 用户按 SHA-256 核对必然失败（docs/dev/release.md §5）。
      - name: 生成 SHA256SUMS 与版本清单
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $arch = '${{ matrix.arch }}'
          $dir = "dist/$arch"
          $setup = Get-Item -Path "$dir/AriaHost-$env:VERSION-$arch-setup.exe" -ErrorAction Stop
          if ($setup.Name -match 'machine') { Write-Error "glob 命中了全机变体包，首版不应出现：$($setup.Name)"; exit 1 }
          $files = @($setup, (Get-Item "$dir/ariahost.exe"))
          $lines = foreach ($f in $files) {
            "$((Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii "$dir/SHA256SUMS.txt"
          $manifest = [ordered]@{
            product   = "AriaHost"
            version   = $env:VERSION
            arch      = $arch
            target    = '${{ matrix.target }}'
            bits      = ${{ matrix.bits }}
            abi       = '${{ matrix.abi }}'
            min_windows = '${{ matrix.min_windows }}'
            variant   = "per-user"
            commit    = "${{ github.sha }}"
            built_at  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            files     = $lines
            notes     = "未经本地代码签名（Q8 首版口径）"
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$dir/AriaHost-$env:VERSION-$arch-manifest.json"
          Get-Content "$dir/SHA256SUMS.txt"
      - name: 上传 artifact（7 天）
        uses: actions/upload-artifact@v4
        with:
          name: AriaHost-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布 GitHub Release
    needs: [version, build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载 artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: 汇总安装包与校验和
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          # M4-1 起两条腿各出一份 per-user 包：AriaHost-<ver>-x64-setup.exe / -x86-setup.exe。
          # 全机变体是 AriaHost-<ver>-<arch>-machine-setup.exe，不会被 '*-<arch>-setup.exe' 命中；
          # 若改成 '*-setup.exe'，将来加变体会一次捞到多个包并互相覆盖。
          for arch in x64 x86; do
            find release-assets -type f -name "*-${arch}-setup.exe" -exec cp {} out/ \;
          done
          find release-assets -type f -name '*-manifest.json' -exec cp {} out/ \;
          ls -l out
          # 硬门禁：双架构都是发版产物，缺任一腿就不发 Release（M4-1 起 x86 转正为必成）
          for arch in x64 x86; do
            if [ ! -f "out/AriaHost-${VERSION}-${arch}-setup.exe" ]; then
              echo "::error::缺少 ${arch} 安装包 AriaHost-${VERSION}-${arch}-setup.exe，构建未产出，本次不发布。"
              exit 1
            fi
          done
          cd out
          sha256sum ./*.exe | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 生成 release notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "AriaHost ${VERSION}"
            echo
            echo "本次产物（per-user 单包，双架构）："
            echo
            echo "- 64 位安装包：\`AriaHost-${VERSION}-x64-setup.exe\`"
            echo "- 32 位安装包：\`AriaHost-${VERSION}-x86-setup.exe\`"
            echo "- 校验和：\`SHA256SUMS.txt\`（下载后务必核对）"
            echo "- 版本清单：\`AriaHost-${VERSION}-x64-manifest.json\`、\`AriaHost-${VERSION}-x86-manifest.json\`"
            echo
            echo "安装包未做代码签名（首版口径），SmartScreen 可能提示「未知发布者」，"
            echo "请以 SHA-256 校验值为准。"
            echo
            echo "## 变更"
            echo
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "${prev}" ]; then
              git log --pretty=format:'- %s (%h)' "${prev}..HEAD"
            else
              git log --pretty=format:'- %s (%h)' -20 HEAD
            fi
            echo
          } > notes.md
          cat notes.md
      - name: 创建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(out/*.exe out/SHA256SUMS.txt out/*manifest.json)
          echo "上传 ${#assets[@]} 个文件"
          gh release create "$TAG" --title "AriaHost $VERSION" --notes-file notes.md --verify-tag "${assets[@]}"
