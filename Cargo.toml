# AriaHost — workspace 根清单（M1 骨架）
#
# 约定：
# - crate 一律放 `crates/`，产物是单二进制 `ariahost.exe`（子命令区分面板/服务/助手）；
# - 工具链 pin 只写在 `rust-toolchain.toml`，静态 CRT 只写在 `.cargo/config.toml`，
#   本文件不重复这两件事；
# - edition 固定 2021（不要 2024）；release 不加 `panic = "abort"`（会破坏 cargo test）。

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doaio/wasm"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# 面板 UI 栈：整条 pin 在 0.37（EG-1，防版本漂移；MSRV 1.95 与本仓库工具链 pin 一致）。
# eframe 用默认 features（含 wgpu 后端）；不要单独关 wgpu——EG-3 的 MemoryHints 走的就是它。
eframe = "0.37"
egui = "0.37"
egui_system_font_provider = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["net"] }
windows-service = "0.8"

# ---- M1-3（aria2 核心获取与版本管理）新增依赖 ----
# 哈希：只用于下载包 SHA-256 校验（1.37.0 有已知交叉参考值；其它版本必须标注未校验）。
sha2 = "0.10"
# HTTP/TLS：**全仓只允许这一条栈**（不要再引 reqwest/native-tls/第二个 HTTP 客户端）。
# 为什么是 ureq 而不是 WinHTTP：见 crates/ariahost-core/src/lib.rs 的模块文档
# （WinHTTP 是 cfg(windows) 代码，Linux 侧的本地 clippy/test 覆盖不到，验证成本更高）。
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# zip：只做「读出 aria2c.exe」，只开 deflate（aria2 官方 win 包用 deflate）；
# 不引 bzip2/zstd/aes 等无关解码器。
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
